<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL PRO | 100% INDEPENDENT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'Fira Code', monospace; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 16px; width: 100%; height: 100%; padding: 25px; }
        #live-canvas { background: #ffffff; color: #000; border-radius: 25px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; padding: 25px; position: relative; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <header class="h-[65px] flex items-center justify-between px-8 bg-black/60 border-b border-white/5 z-50">
        <div class="flex items-center gap-6">
            <button @click="menuOpen = true" class="text-2xl text-blue-500">•••</button>
            <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter">MAJAL <span class="text-white font-light text-sm italic">INDEPENDENT</span></h1>
        </div>
        <button @click="formatCode()" class="bg-blue-600 px-6 py-2 rounded-xl text-xs font-bold shadow-lg shadow-blue-900/40">🧹 تنسيق المحرك</button>
    </header>

    <main class="flex flex-col h-[calc(100vh-65px)] p-4 gap-4 bg-[#020617]">
        <div class="flex-1 glass rounded-[35px] flex flex-col overflow-hidden">
            <div class="px-6 py-2 bg-white/5 border-b border-white/5 flex justify-between items-center text-[10px] font-black text-blue-500 tracking-widest uppercase">
                <span>محرر مَجال (Independent Syntax)</span>
            </div>
            <textarea id="majal-editor" @input="onInput($event)" placeholder="<زر> اضغط هنا </زر>"></textarea>
        </div>

        <div class="flex-1 glass rounded-[35px] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-8 py-3 border-b border-white/5 bg-white/5 flex justify-between items-center text-[10px] font-black text-gray-500 uppercase tracking-widest">
                <span>مخرج النواة (Majal Engine v3.1)</span>
                <span class="text-blue-500 animate-pulse">● 100% Native</span>
            </div>
            <div class="flex-1 p-6 overflow-hidden">
                <div id="live-canvas"></div>
            </div>
        </div>
    </main>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 bottom-0 w-[280px] bg-[#050505] p-10 flex flex-col z-[100] transition-transform duration-300" :class="lang === 'ar' ? 'right-0 border-l border-white/10' : 'left-0 border-r border-white/10'" x-cloak :style="menuOpen ? 'transform: translateX(0)' : (lang === 'ar' ? 'transform: translateX(100%)' : 'transform: translateX(-100%)')">
        <nav class="flex-1 space-y-6 pt-10">
            <button @click="activeModal = 'about'; menuOpen = false" class="w-full text-right p-4 hover:bg-white/5 transition font-black flex justify-between items-center text-sm border-b border-white/5"><span>من نحن</span> ℹ️</button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar'); menuOpen = false" class="w-full text-right p-4 hover:bg-white/5 transition font-black flex justify-between items-center text-sm border-b border-white/5"><span>🌐 الترجمة</span></button>
            <button @click="exportProject()" class="w-full text-right p-4 rounded-2xl bg-green-600/10 text-green-400 border border-green-500/20 font-black flex justify-between items-center mt-10"><span>تصدير 📥</span></button>
        </nav>
        <div class="mt-auto text-center border-t border-white/5 pt-6 text-[9px] font-black text-gray-700 uppercase tracking-widest">صُنع بالسيادة الكاملة 🇸🇦</div>
    </div>

    <script>
        function majalApp() {
            return {
                menuOpen: false, lang: 'ar', activeModal: null,
                init() {
                    const saved = localStorage.getItem('majal_v31');
                    if(saved) { document.getElementById('majal-editor').value = saved; setTimeout(() => MajalEngine.parse(), 100); }
                },
                onInput(e) { localStorage.setItem('majal_v31', e.target.value); MajalEngine.parse(); },
                formatCode() { /* ... */ },
                exportProject() { /* ... */ }
            }
        }

        // محرك مَجال السيادي (Majal Sovereign Engine)
        const MajalEngine = {
            parse() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                canvas.innerHTML = ''; 

                // المرحلة 1: الـ Lexer (تحويل الكود إلى قطع منطقية)
                // هنا المحرك يقرأ الأقواس ويفسرها بطريقته الخاصة
                const regex = /<([^>]+)>([\s\S]*?)<\/\1>/g;
                let match;
                
                while ((match = regex.exec(code)) !== null) {
                    const tag = match[1].trim();
                    const content = match[2].trim();
                    
                    // تحويل التاغات العربية إلى عناصر حقيقية بنمط مَجال
                    this.render(tag, content, canvas);
                }
            },

            render(tag, content, parent) {
                let el;
                
                // هنا "سيادة" اللغة: أنت اللي تحدد كل تاغ وش يسوي بالضبط
                switch(tag) {
                    case 'عنوان':
                        el = document.createElement('h1');
                        el.style.cssText = "font-size: 32px; font-weight: 900; color: #0f172a; margin-bottom: 20px;";
                        break;
                    case 'زر':
                        el = document.createElement('button');
                        el.style.cssText = "background: #2563eb; color: white; padding: 12px 30px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);";
                        break;
                    case 'نص':
                        el = document.createElement('p');
                        el.style.cssText = "color: #475569; line-height: 1.6; font-size: 16px;";
                        break;
                    default:
                        el = document.createElement('div');
                }

                if (el) {
                    el.innerText = content;
                    parent.appendChild(el);
                }
            }
        };
    </script>
</body>
</html>
