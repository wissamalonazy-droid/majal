<script>
function generateSovereignSite() {
    const q = document.getElementById('prompt-in').value;
    
    // 1. مستشعر الروابط (Link Detector)
    const urlMatch = q.match(/https?:\/\/[^\s]+(?:jpg|png|webp|jpeg|gif)/i);
    const userImg = urlMatch ? urlMatch[0] : null;

    // 2. تحليل الألوان والاسم (المحرك المعتاد)
    const storeName = q.match(/(?:متجر|موقع)\s+([\u0621-\u064A0-9]+)/)?.[1] || "مشروع مجال";
    const bg = q.includes('أسود') ? '#000' : '#fff';
    const accent = q.includes('ذهبي') ? '#d4af37' : '#2563eb';

    // 3. بناء الكود مع دعم الصور الخارجية
    const finalHTML = `
    <!DOCTYPE html>
    <html lang="ar" dir="rtl">
    <head>
      <meta charset="UTF-8">
      <style>
        body { font-family: sans-serif; background: ${bg}; color: ${bg==='#000'?'#fff':'#000'}; margin:0; }
        header { 
            background: ${userImg ? `url('${userImg}')` : accent}; 
            background-size: cover; 
            background-position: center;
            padding: 100px 20px; 
            text-align: center; 
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px; }
        .card { background: ${bg==='#000'?'#111':'#f9f9f9'}; border-radius: 20px; padding: 20px; border: 1px solid ${accent}33; text-align: center; }
        .card img { width: 100%; border-radius: 15px; margin-bottom: 15px; }
      </style>
    </head>
    <body>
      <header><h1>${storeName}</h1></header>
      <div class="grid">
        <div class="card">
          <img src="${userImg || 'https://via.placeholder.com/300'}" alt="صورة المستخدم">
          <h3>منتجك الخاص</h3>
          <p>السعر حسب الطلب</p>
          <button style="background:${accent}; color:#fff; border:none; padding:10px; width:100%; border-radius:10px;">إضافة للسلة</button>
        </div>
      </div>
    </body>
    </html>`;

    document.getElementById('code-out').value = finalHTML;
    const v = document.getElementById('viewport');
    v.contentWindow.document.open();
    v.contentWindow.document.write(finalHTML);
    v.contentWindow.document.close();
}
</script>
