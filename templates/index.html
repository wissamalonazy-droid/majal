<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL 2.0.1 | PRO INTERFACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top right, #0a192f, #020617); 
            color: #f8fafc; 
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
        }
        .pro-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(59, 130, 246, 0.2); 
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .editor-area { 
            font-family: 'Consolas', monospace; 
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .btn-grad {
            background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
            transition: all 0.3s ease;
        }
        .btn-grad:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px #2563eb;
        }
        /* حركة النص البرتقالي */
        .magic-text {
            color: #fb923c; /* لون برتقالي فخم */
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            padding: 5px 15px;
            border: 1px dashed #fb923c;
            border-radius: 10px;
        }
        .magic-text:hover {
            background: rgba(251, 146, 60, 0.1);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-5xl mx-auto space-y-8">
        <div class="flex justify-between items-end border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl font-black text-blue-500 tracking-tighter neon-glow">MAJAL <span class="text-white">2.0.1</span></h1>
                <p class="text-gray-400 text-sm mt-2 font-mono">NEXT-GEN PROGRAMMING INTERFACE</p>
            </div>
            <div class="flex space-x-2 space-x-reverse">
                <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
            </div>
        </div>

        <div class="pro-card p-2">
            <textarea id="codeEditor" class="w-full h-80 p-8 editor-area text-blue-400 text-xl outline-none resize-none" placeholder="// أدخل أوامر مَجال البرمجية هنا يا وسام..."></textarea>
        </div>

        <div id="output" class="pro-card p-8 min-h-[120px] border-r-4 border-blue-500 bg-slate-900/40 text-sm leading-relaxed overflow-hidden flex items-center justify-center">
            <span class="text-slate-500 italic">// المحرك مستعد للبناء...</span>
        </div>

        <button onclick="runMajal()" class="w-full btn-grad py-5 rounded-2xl font-bold text-xl tracking-widest uppercase flex items-center justify-center space-x-4 space-x-reverse">
            <span>تشغيل المحرك</span>
            <span class="text-2xl">⚡</span>
        </button>
    </div>

    <div id="copyModal" class="fixed inset-0 bg-slate-950/98 hidden z-50 flex flex-col p-6 md:p-12 backdrop-blur-2xl">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black text-blue-400 italic tracking-widest">ARCHITECTURE CODE</h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white text-4xl">&times;</button>
        </div>
        <pre id="modalText" class="bg-black/80 p-8 rounded-[2rem] border border-white/5 flex-1 overflow-auto text-blue-400 font-mono text-base whitespace-pre-wrap shadow-inner"></pre>
        <div class="mt-8 flex justify-center">
            <button onclick="copyAction()" id="copyBtn" class="bg-blue-600 text-white px-16 py-5 rounded-2xl font-black text-xl hover:bg-blue-500 transition-all shadow-xl shadow-blue-900/40 active:scale-95">نسخ الكود 📋</button>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            
            if(!code.trim()) return;

            outputDiv.innerHTML = '<div class="animate-pulse text-blue-400 font-bold tracking-widest">🔄 جاري معالجة أوامر وسام...</div>';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                // الحركة اللي تبيها: النص البرتقالي اللي يفتح الكود
                outputDiv.innerHTML = `
                    <div class="text-center">
                        <span onclick="openModal(\`${encodeURIComponent(data.result)}\`)" class="magic-text uppercase tracking-widest text-lg">
                            ✨ تم بناء التصور بنجاح.. اضغط هنا لاستعراض الكود ✨
                        </span>
                    </div>`;
            } catch (e) { 
                outputDiv.innerHTML = '<span class="text-red-500 font-bold">❌ فشل في الاتصال بالسيرفر</span>'; 
            }
        }

        function openModal(encoded) {
            const decoded = decodeURIComponent(encoded);
            document.getElementById('modalText').innerText = decoded;
            document.getElementById('copyModal').classList.remove('hidden');
            const btn = document.getElementById('copyBtn');
            btn.innerText = "نسخ الكود 📋";
            btn.className = "bg-blue-600 text-white px-16 py-5 rounded-2xl font-black text-xl hover:bg-blue-500 transition-all shadow-xl shadow-blue-900/40 active:scale-95";
        }

        function closeModal() { 
            document.getElementById('copyModal').classList.add('hidden'); 
        }

        // دالة النسخ الاحترافية لجميع الأجهزة
        async function copyAction() {
            const text = document.getElementById('modalText').innerText;
            const btn = document.getElementById('copyBtn');
            
            try {
                await navigator.clipboard.writeText(text);
                btn.innerText = "تم النسخ بنجاح! ✅";
                btn.style.backgroundColor = "#10b981";
            } catch (err) {
                // طريقة احتياطية
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                btn.innerText = "تم النسخ بنجاح! ✅";
                btn.style.backgroundColor = "#10b981";
            }
            
            setTimeout(() => {
                btn.innerText = "نسخ الكود 📋";
                btn.style.backgroundColor = "#2563eb";
            }, 2000);
        }
    </script>
</body>
</html>
