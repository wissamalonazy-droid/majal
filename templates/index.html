<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | التدريج السيادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; 
            overflow: hidden; height: 100vh; width: 100vw; display: flex; flex-direction: column;
        }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* تحسين الشاشة البيضاء "الزبال" إلى شاشة فخمة */
        #live-canvas { 
            background: #0f172a; /* خلفية كحلية عميقة */
            border-radius: 20px; width: 100%; height: 100%; 
            overflow-y: auto; overflow-x: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* تخصيص السكرول بار عشان ما يخرب الشكل */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        .sidebar-menu { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; }
    </style>
</head>
<body x-data="{ menuOpen: false, mode: 'pro', lang: 'ar' }">

    <header class="h-[65px] shrink-0 flex items-center justify-between px-6 bg-black/40 border-b border-white/5 z-50">
        <div class="flex items-center gap-4">
            <button @click="menuOpen = true" class="text-2xl text-blue-500 hover:scale-110 transition">•••</button>
            <h1 class="text-xl font-black italic tracking-tighter text-blue-500">MAJAL <span class="text-white font-light text-sm">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-4 py-1 rounded-lg text-[10px] font-bold transition-all">سهل (مبتدئ)</button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-4 py-1 rounded-lg text-[10px] font-bold transition-all">معقد (محترف)</button>
        </div>
    </header>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[99]" @click="menuOpen = false" x-transition.opacity></div>
    <div x-show="menuOpen" 
         class="fixed top-0 right-0 w-[300px] h-full bg-[#050505] border-l border-white/10 sidebar-menu p-8 flex flex-col z-[100]"
         x-transition:enter="transform translate-x-full" x-transition:enter-end="transform translate-x-0"
         x-transition:leave="transform translate-x-0" x-transition:leave-end="transform translate-x-full">
        
        <div class="mb-10 pt-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-blue-800 mb-4 flex items-center justify-center font-black text-2xl shadow-xl shadow-blue-900/40">M</div>
            <h3 class="font-black text-xl">المضياني 🔒</h3>
            <p class="text-[10px] text-gray-500 tracking-widest uppercase mt-1">Sovereign Developer</p>
        </div>

        <nav class="flex-1 space-y-2">
            <button class="w-full text-right flex items-center justify-between p-3 rounded-xl hover:bg-white/5 transition group">
                <span class="font-bold text-sm">الملف الشخصي</span> <span class="group-hover:translate-x-[-5px] transition">👤</span>
            </button>
            <button class="w-full text-right flex items-center justify-between p-3 rounded-xl hover:bg-white/5 transition group">
                <span class="font-bold text-sm">من نحن</span> <span class="group-hover:translate-x-[-5px] transition">ℹ️</span>
            </button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right flex items-center justify-between p-3 rounded-xl bg-blue-600/10 text-blue-400 border border-blue-500/20 transition">
                <span class="font-bold text-sm" x-text="lang === 'ar' ? 'English Language' : 'اللغة العربية'"></span> <span>🌐</span>
            </button>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5 text-center">
            <p class="text-[10px] font-black text-blue-500 tracking-[0.2em] mb-1">MADE IN SAUDI ARABIA</p>
            <p class="text-[9px] text-gray-600 font-bold uppercase">صُنع بفخر في المملكة العربية السعودية 🇸🇦</p>
        </div>
    </div>

    <main class="flex-1 flex overflow-hidden p-4 gap-4 bg-[#020617]">
        
        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div class="px-6 py-4 bg-white/5 border-b border-white/5 flex justify-between items-center">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500"></div>
                </div>
                <span class="text-[10px] font-black text-blue-500 tracking-widest" x-text="mode === 'easy' ? 'MODE: BEGINNER' : 'MODE: PROFESSIONAL'"></span>
            </div>
            
            <textarea id="majal-editor" oninput="MajalCore.process()" 
                      class="flex-1 bg-transparent p-8 outline-none font-mono text-blue-300 resize-none text-lg leading-relaxed" 
                      placeholder="// ابدأ بكتابة كود مَجال القوي هنا..."></textarea>
        </div>

        <div class="w-1/3 glass rounded-[30px] p-2 flex flex-col overflow-hidden">
            <div class="p-4 flex items-center justify-between">
                <span class="text-[10px] font-black text-gray-500 tracking-widest uppercase">Live View</span>
                <div class="flex gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                </div>
            </div>
            <div id="live-canvas" class="flex-1">
                <div class="flex items-center justify-center h-full text-gray-700 font-black text-sm uppercase tracking-widest italic">
                    Waiting for Code...
                </div>
            </div>
        </div>

    </main>

    <script>
        const MajalCore = {
            registry: new Map(),
            process: function() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = '<div class="flex items-center justify-center h-full text-gray-700 font-black text-sm italic uppercase tracking-widest">Waiting for Code...</div>'; return; }
                
                this.registry.clear();
                let htmlOutput = "";
                const lines = code.split('\n');

                lines.forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const parts = clean.replace("عرف", "").split("=");
                        if (parts[1]) this.registry.set(parts[0].trim(), parts[1].trim().replace(/"/g, "").replace(/'/g, ""));
                    } else {
                        htmlOutput += line + "\n";
                    }
                });

                this.registry.forEach((v, k) => {
                    htmlOutput = htmlOutput.replace(new RegExp(`{${k}}`, 'g'), v);
                });

                canvas.innerHTML = htmlOutput;
            }
        };
    </script>
</body>
</html>
