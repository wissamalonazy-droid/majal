<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مَجال PRO | Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --border: #30363d;
  --accent: #f5a623; --text: #c9d1d9;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: 'Tajawal', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header */
.top-nav { height: 60px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
.logo { font-size: 20px; font-weight: 900; color: var(--accent); }
.btn-gen { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 900; cursor: pointer; }

/* Workspace */
.workspace { display: grid; grid-template-columns: 1fr 1fr; flex: 1; overflow: hidden; gap: 2px; background: var(--border); }

/* Input Side */
.input-side { background: var(--bg); display: flex; flex-direction: column; }
.label { padding: 10px 20px; font-size: 11px; background: var(--panel); color: #8b949e; border-bottom: 1px solid var(--border); }
#user-command { flex: 1; background: transparent; color: var(--accent); border: none; outline: none; padding: 25px; font-size: 18px; font-weight: bold; resize: none; line-height: 1.6; }

/* Output Side (The Generated Code) */
.output-side { background: #000; display: flex; flex-direction: column; }
#generated-code { flex: 1; background: #050505; color: #7ee787; border: none; outline: none; padding: 25px; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.5; resize: none; white-space: pre; overflow: auto; direction: ltr; text-align: left; }

.copy-btn { background: #30363d; color: #fff; border: none; padding: 5px 15px; border-radius: 5px; font-size: 11px; cursor: pointer; position: absolute; top: 70px; left: 20px; z-index: 10; }
</style>
</head>
<body>

<header class="top-nav">
  <div class="logo">مَجال PRO <span>| مصنع الأكواد</span></div>
  <button class="btn-gen" onclick="generateCode()">⚡ إنتاج كود المتجر</button>
</header>

<div class="workspace">
  <div class="input-side">
    <div class="label">أدخل مواصفات المتجر (النوع + الألوان)</div>
    <textarea id="user-command" placeholder="مثال: متجر سديم لبيع العطور ألوان أسود وذهبي"></textarea>
  </div>

  <div class="output-side" style="position: relative;">
    <div class="label">كود HTML/CSS الجاهز للنسخ</div>
    <button class="copy-btn" onclick="copyToClipboard()">نسخ الكود</button>
    <textarea id="generated-code" readonly>// الكود المنتج سيظهر هنا...</textarea>
  </div>
</div>

<script>
function generateCode() {
  const input = document.getElementById('user-command').value.trim();
  if (!input.includes("متجر")) return;

  // استخراج البيانات
  const storeName = input.match(/متجر\s+([\u0621-\u064A0-9]+)/)?.[1] || "متجري الخاص";
  
  const colors = {
    'أحمر': '#ef4444', 'أزرق': '#3b82f6', 'أصفر': '#facc15', 
    'أبيض': '#ffffff', 'أسود': '#000000', 'ذهبي': '#d4af37', 'بني': '#78350f'
  };

  let primary = '#3b82f6'; 
  let bg = '#ffffff';
  let text = '#000000';

  Object.keys(colors).forEach(c => {
    if(input.includes(c)) {
      if(c === 'أسود' || c === 'أبيض') {
        bg = colors[c];
        text = (c === 'أسود') ? '#ffffff' : '#000000';
      } else {
        primary = colors[c];
      }
    }
  });

  let emoji = "📦";
  if(input.includes("عطر")) emoji = "🧴";
  if(input.includes("ساعة")) emoji = "⌚";

  // توليد كود HTML كامل
  const finalCode = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>${storeName}</title>
  <style>
    body { font-family: sans-serif; background: ${bg}; color: ${text}; margin: 0; padding: 0; }
    header { background: ${primary}; padding: 20px; text-align: center; color: #fff; }
    .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .product-card { background: ${bg === '#000000' ? '#111' : '#f9f9f9'}; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid ${primary}22; }
    .price { color: ${primary}; font-weight: bold; font-size: 20px; }
    button { background: ${primary}; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>${storeName}</h1>
    <p>أهلاً بك في متجرنا</p>
  </header>
  <div class="container">
    <div class="product-card">
      <div style="font-size: 50px;">${emoji}</div>
      <h3>منتج مميز</h3>
      <p class="price">150 ريال</p>
      <button>إضافة للسلة</button>
    </div>
    </div>
</body>
</html>`;

  document.getElementById('generated-code').value = finalCode;
}

function copyToClipboard() {
  const codeArea = document.getElementById('generated-code');
  codeArea.select();
  document.execCommand('copy');
  alert("تم نسخ الكود بنجاح!");
}
</script>
</body>
</html>
