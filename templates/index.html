<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Majal v2 FIXED</title>

<style>
:root {
  --ink:#0d0f14;
  --text:#d4daf0;
  --card:#181c26;
  --amber:#f5a623;
  --line:#1f2535;
}

* {margin:0;padding:0;box-sizing:border-box;}

body{
  background:var(--ink);
  color:var(--text);
  font-family:monospace;
}

textarea{
  width:100%;
  height:40vh;
  background:#111;
  color:#fff;
  padding:10px;
}

button{
  padding:10px;
  background:var(--amber);
  border:none;
  cursor:pointer;
}

#out{
  background:#000;
  padding:10px;
  min-height:200px;
}
</style>
</head>

<body>

<textarea id="code">
// مثال جاهز

منتج عطر {
  اسم: "فاخر"
  سعر: 500
  مخزون: 2
}

سلة طلب {}

أضف(طلب, عطر, 1)

حاول {
  اشتري(طلب)
} امسك {
  أطبع("فشل")
}

قيّم(عطر, 5, "جبار")
</textarea>

<button onclick="run()">تشغيل</button>

<div id="out"></div>

<script>

// ================== TOKENS ==================
const KEYWORDS = [
'منتج','سلة','عميل','خصم','إذا','وإلا',
'أضف','اشتري','أطبع',
'حاول','امسك','قيّم'
];

// ================== LEXER بسيط ==================
function tokenize(code){
  return code.split(/\s+/).filter(Boolean);
}

// ================== Interpreter بسيط ==================
let env = {};
let output = [];

function print(msg){
  output.push(msg);
}

function run(){
  output=[];
  env={};
  const code=document.getElementById("code").value;

  try{
    exec(code);
  }catch(e){
    print("❌ "+e.message);
  }

  document.getElementById("out").innerHTML=
    output.map(x=>"<div>"+x+"</div>").join("");
}

// ================== EXEC ==================
function exec(code){

  // منتج
  code.replace(/منتج\s+(\w+)\s*{([^}]*)}/g,(m,name,body)=>{
    let obj={type:"product",reviews:[]};

    body.split("\n").forEach(line=>{
      let [k,v]=line.split(":");
      if(!k)return;
      obj[k.trim()] = isNaN(v) ? v.replace(/"/g,'').trim() : Number(v);
    });

    env[name]=obj;
    print("📦 "+name);
  });

  // سلة
  code.replace(/سلة\s+(\w+)/g,(m,name)=>{
    env[name]={type:"cart",items:[]};
    print("🛒 "+name);
  });

  // أضف
  code.replace(/أضف\(([^)]+)\)/g,(m,args)=>{
    let [c,p,q]=args.split(",").map(x=>x.trim());
    env[c].items.push({p:env[p],q:Number(q)});
    print("➕ "+p);
  });

  // حاول / امسك
  if(code.includes("حاول")){
    try{
      exec(code.split("حاول")[1].split("امسك")[0]);
    }catch(e){
      exec(code.split("امسك")[1]);
    }
  }

  // اشتري
  code.replace(/اشتري\(([^)]+)\)/g,(m,arg)=>{
    let cart=env[arg.trim()];
    let total=0;

    cart.items.forEach(i=>{
      if(i.p.مخزون < i.q){
        throw new Error("نفذ المخزون");
      }

      i.p.مخزون -= i.q;
      total += i.p.سعر * i.q;
    });

    print("💳 تم الشراء: "+total);
  });

  // قيّم
  code.replace(/قيّم\(([^)]+)\)/g,(m,args)=>{
    let [p,s,c]=args.split(",");
    env[p.trim()].reviews.push({
      stars:Number(s),
      comment:c.replace(/"/g,'')
    });

    print("⭐ تم التقييم");
  });

  // أطبع
  code.replace(/أطبع\(([^)]+)\)/g,(m,arg)=>{
    print(arg.replace(/"/g,''));
  });

}

</script>

</body>
</html>
