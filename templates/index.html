<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | NUCLEUS v15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #0ea5e9; --bg: #020617; }
        body { 
            background: radial-gradient(circle at top right, #0f172a, var(--bg)); 
            color: #f8fafc; font-family: 'Tajawal', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        
        /* تصميم الزجاج */
        .glass { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 24px; }
        
        /* محرر الكود */
        #codeEditor { font-family: 'Fira Code', monospace; background: transparent; color: #93c5fd; width: 100%; padding: 25px; outline: none; border: none; font-size: 16px; line-height: 1.6; resize: none; flex: 1; }
        
        /* --- تحسين المحاكي (بدون الخية) --- */
        .preview-wrapper { 
            display: flex; align-items: center; justify-content: center; 
            width: 100%; height: 100%; background: #0f172a; overflow: auto; padding: 0; /* تم إزالة الحشوة لإعطاء مساحة أكبر */
        }
        
        .iframe-container { 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            background: white; 
            box-shadow: 0 0 100px rgba(0,0,0,0.7); 
            border: none; /* تم إزالة الخية تماماً */
            border-radius: 0; /* تم جعل الزوايا حادة لملء المساحة */
        }
        
        /* تحديد المقاسات الصارمة ولكن بدون إطارات */
        .mobile-view { width: 375px !important; height: 667px !important; }
        .tablet-view { width: 768px !important; height: 1024px !important; }
        .desktop-view { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body x-data="{ view: 'desktop', lang: 'ar', dir: 'rtl' }" :class="lang === 'en' ? 'en-mode' : ''" :dir="dir">

    <header class="h-[75px] flex items-center justify-between px-8 bg-black/40 border-b border-white/5 backdrop-blur-md">
        <div class="flex items-center gap-4 flex-1">
            <h1 class="text-xl font-black text-blue-500 italic uppercase tracking-tighter">MAJAL <span class="text-white font-light text-sm">PRO</span></h1>
        </div>

        <div class="hidden md:flex flex-[2] justify-center bg-white/5 p-1.5 rounded-2xl border border-white/10 gap-1">
            <button @click="view = 'mobile'" :class="view === 'mobile' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'" class="px-5 py-1.5 rounded-xl text-[10px] font-bold transition-all flex items-center gap-2">
                <span>📱</span> Mobile
            </button>
            <button @click="view = 'tablet'" :class="view === 'tablet' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'" class="px-5 py-1.5 rounded-xl text-[10px] font-bold transition-all flex items-center gap-2">
                <span>📟</span> Tablet
            </button>
            <button @click="view = 'desktop'" :class="view === 'desktop' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'" class="px-5 py-1.5 rounded-xl text-[10px] font-bold transition-all flex items-center gap-2">
                <span>💻</span> Desktop
            </button>
        </div>

        <div class="flex-1 flex justify-end">
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar'); dir = (lang === 'ar' ? 'rtl' : 'ltr')" 
                    class="bg-white/5 px-5 py-2.5 rounded-2xl text-[10px] font-black border border-white/10 hover:bg-blue-500/20 transition-all uppercase tracking-widest">
                <span x-text="lang === 'ar' ? 'English 🌐' : 'العربية 🌐'"></span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-6 flex flex-col gap-5 overflow-hidden">
        <div class="glass flex-1 flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                <div class="flex items-center gap-3">
                    <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                    <span class="text-[11px] text-blue-400 font-black uppercase tracking-[0.2em]">بيئة تطوير مَجال</span>
                </div>
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/40"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/40"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/40"></div>
                </div>
            </div>

            <textarea id="codeEditor" spellcheck="false" placeholder="// اكتب كودك هنا..."></textarea>
            
            <div id="statusBar" class="p-4 bg-black/40 text-xs border-t border-white/5 text-blue-300 font-mono min-h-[60px]">📟 النظام جاهز</div>
        </div>

        <button onclick="runMajal()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 p-5 rounded-[2rem] font-black text-xl shadow-2xl shadow-blue-900/40 transition-all group">
            تشغيل النظام ⚡
        </button>
    </main>

    <div id="previewModal" class="fixed inset-0 z-[100] bg-slate-950/98 hidden flex flex-col">
        <div class="w-full p-4 bg-black flex justify-between items-center border-b border-white/10">
            <div class="flex items-center gap-6">
                <span class="text-blue-500 font-black text-xs italic tracking-widest uppercase">Live Architecture</span>
                <div class="flex bg-white/5 rounded-lg p-1 gap-2">
                    <button @click="view = 'mobile'" class="p-1 hover:bg-blue-500/20 rounded">📱</button>
                    <button @click="view = 'tablet'" class="p-1 hover:bg-blue-500/20 rounded">📟</button>
                    <button @click="view = 'desktop'" class="p-1 hover:bg-blue-500/20 rounded">💻</button>
                </div>
            </div>
            <button onclick="document.getElementById('previewModal').classList.add('hidden')" class="text-white hover:text-red-500 text-4xl transition-colors leading-none">&times;</button>
        </div>
        
        <div class="preview-wrapper">
            <iframe id="livePreview" class="iframe-container transition-all duration-500" :class="view === 'mobile' ? 'mobile-view' : (view === 'tablet' ? 'tablet-view' : 'desktop-view')"></iframe>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const statusBar = document.getElementById('statusBar');
            if(!code.trim()) return;

            statusBar.innerHTML = '<span class="animate-pulse text-white">🔄 جاري معالجة النواة...</span>';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                if (data.result.toLowerCase().includes("<html")) {
                    const iframe = document.getElementById('livePreview');
                    const doc = iframe.contentWindow.document;
                    doc.open(); doc.write(data.result); doc.close();
                    document.getElementById('previewModal').classList.remove('hidden');
                } else {
                    statusBar.innerHTML = `<span class="text-blue-300">${data.result}</span>`;
                }
            } catch (e) { statusBar.innerText = "❌ خطأ اتصال"; }
        }
    </script>
</body>
</html>
