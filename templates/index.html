<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مَجال PRO | محرك السمات v25</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    :root { --ink: #05070a; --panel: #0c0f16; --border: #1c2230; --gold: #f5a623; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--ink); color: #d1d5db; font-family: 'Tajawal', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { height: 60px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; flex-shrink: 0; }
    .logo { font-size: 20px; font-weight: 900; color: var(--gold); }
    .build-btn { background: var(--gold); color: #000; border: none; padding: 10px 30px; border-radius: 10px; font-weight: 900; cursor: pointer; transition: 0.3s; }

    /* Workspace */
    .workspace { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .top-view { height: 55%; background: #000; display: flex; justify-content: center; padding: 15px; border-bottom: 2px solid var(--border); }
    #viewport { width: 100%; max-width: 1000px; background: #fff; border-radius: 20px; border: none; }

    .bottom-controls { height: 45%; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
    .pane { background: var(--ink); display: flex; flex-direction: column; }
    .pane-label { padding: 8px 15px; font-size: 10px; background: var(--panel); color: #4b5563; font-weight: 900; border-bottom: 1px solid var(--border); }
    
    #prompt-in { flex: 1; background: transparent; color: var(--gold); border: none; outline: none; padding: 20px; font-size: 17px; font-weight: 700; resize: none; line-height: 1.6; }
    #code-out { flex: 1; background: #010101; color: #7ee787; border: none; outline: none; padding: 20px; font-family: 'Fira Code', monospace; font-size: 11px; direction: ltr; text-align: left; }
</style>
</head>
<body>

<header>
    <div class="logo">MAJAL <span style="color:#fff; font-weight:300;">ENGINE v25</span></div>
    <button class="build-btn" onclick="buildSovereign()">⚡ بناء بالملي متر</button>
</header>

<div class="workspace">
    <div class="top-view"><iframe id="viewport"></iframe></div>
    <div class="bottom-controls">
        <div class="pane">
            <div class="pane-label">مدخلات المواصفات الهندسية</div>
            <textarea id="prompt-in">متجر المضياني، خلفية أسود، هيدر ذهبي، حواف دائرية جداً، خط عريض، 3 منتجات</textarea>
        </div>
        <div class="pane">
            <div class="pane-label">الكود المصدر المولد (للقص واللصق) <span style="color:var(--gold); cursor:pointer;" onclick="copyCode()">[نسخ]</span></div>
            <textarea id="code-out" readonly></textarea>
        </div>
    </div>
</div>

<script>
function buildSovereign() {
    const q = document.getElementById('prompt-in').value;
    
    // محرك استخراج السمات (The Attribute Engine)
    // هذا المحرك يربط كل "وصف" بقيمة CSS حقيقية
    const getAttr = (map, def) => {
        for (let key in map) { if (q.includes(key)) return map[key]; }
        return def;
    };

    const store = {
        name: q.match(/متجر\s+([\u0621-\u064A0-9]+)/)?.[1] || "متجر جديد",
        bg: getAttr({'أسود':'#000','أبيض':'#fff','رمادي':'#222','أزرق':'#001f3f'}, '#fff'),
        headerColor: getAttr({'ذهبي':'#d4af37','فضي':'#c0c0c0','أزرق':'#2563eb','أحمر':'#e11d48','أخضر':'#10b981'}, '#2563eb'),
        radius: getAttr({'دائرية جدا':'50px','دائرية':'15px','حادة':'0px'}, '10px'),
        fontWeight: getAttr({'عريض':'900','خفيف':'300'}, '700'),
        columns: getAttr({'3 منتجات':'1fr 1fr 1fr','منتجين':'1fr 1fr','منتج واحد':'1fr'}, '1fr 1fr'),
        shadow: q.includes('فخم') ? '0 20px 40px rgba(0,0,0,0.3)' : 'none'
    };

    const text = store.bg === '#000' ? '#fff' : '#000';

    const finalHTML = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --p: ${store.headerColor}; --bg: ${store.bg}; --t: ${text}; --r: ${store.radius}; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--t); margin: 0; padding-bottom: 50px; }
        header { background: var(--p); padding: 70px 20px; text-align: center; color: ${store.headerColor==='#fff'?'#000':'#fff'}; box-shadow: ${store.shadow}; }
        .grid { display: grid; grid-template-columns: ${store.columns}; gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .card { background: ${store.bg==='#000'?'#111':'#fdfdfd'}; border-radius: var(--r); padding: 30px; text-align: center; border: 2px solid var(--p)22; box-shadow: ${store.shadow}; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); border-color: var(--p); }
        h1 { font-weight: ${store.fontWeight}; font-size: 45px; margin: 0; letter-spacing: -1px; }
        .price { color: var(--p); font-weight: 900; font-size: 28px; margin: 15px 0; }
        button { background: var(--p); color: white; border: none; padding: 15px; border-radius: var(--r); width: 100%; font-weight: 900; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <header><h1>${store.name}</h1></header>
    <div class="grid">
        <div class="card"><div style="font-size:60px">🧴</div><h3>منتج ملكي</h3><div class="price">450 ريال</div><button>إضافة للسلّة</button></div>
        <div class="card"><div style="font-size:60px">🧴</div><h3>منتج فاخر</h3><div class="price">320 ريال</div><button>إضافة للسلّة</button></div>
    </div>
</body>
</html>`;

    document.getElementById('code-out').value = finalHTML;
    const v = document.getElementById('viewport');
    v.contentWindow.document.open();
    v.contentWindow.document.write(finalHTML);
    v.contentWindow.document.close();
}

function copyCode() {
    const c = document.getElementById('code-out');
    c.select();
    document.execCommand('copy');
    alert("تم نسخ الكود بنجاح!");
}
</script>
</body>
</html>
