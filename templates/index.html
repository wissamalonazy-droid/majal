<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | MAX VIEW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'Fira Code', monospace; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 14px; width: 100%; height: 100%; padding: 15px; }
        
        /* الشاشة البيضاء العملاقة */
        #live-canvas { 
            background: #ffffff; color: #000; border-radius: 30px; 
            width: 100%; height: 100%; overflow: auto; 
            border: 8px solid #1e293b; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        
        .modal-bg { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <header class="h-[60px] flex items-center justify-between px-8 bg-black/50 border-b border-white/5 z-50">
        <div class="flex items-center gap-4">
            <button @click="menuOpen = true" class="text-2xl text-blue-500 hover:scale-110 transition">•••</button>
            <h1 class="text-xl font-black italic text-blue-500 tracking-tighter">MAJAL <span class="text-white font-light text-xs">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-5 py-1 rounded-lg text-[10px] font-bold transition-all" x-text="lang === 'ar' ? 'سهل' : 'Easy'"></button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-5 py-1 rounded-lg text-[10px] font-bold transition-all" x-text="lang === 'ar' ? 'معقد' : 'Pro'"></button>
        </div>
    </header>

    <main class="flex h-[calc(100vh-60px)] p-4 gap-4 bg-[#020617]">
        
        <div class="w-[30%] glass rounded-[35px] flex flex-col overflow-hidden shadow-2xl">
            <div x-show="mode === 'easy'" class="px-4 py-2 bg-blue-600/10 border-b border-blue-500/10 flex gap-2 overflow-x-auto no-scrollbar items-center">
                <button @click="addSection('header')" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-bold hover:bg-blue-500 transition">+ هيدر</button>
                <button @click="addSection('features')" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-bold hover:bg-blue-500 transition">+ مميزات</button>
            </div>
            <div class="px-5 py-2 bg-white/5 border-b border-white/5 flex justify-between items-center text-[9px] font-black text-blue-400">
                <span x-text="mode === 'easy' ? 'EDITOR: EASY' : 'EDITOR: PRO'"></span>
            </div>
            <textarea id="majal-editor" @input="onInput($event)" :placeholder="lang === 'ar' ? '// اكتب كودك هنا...' : '// Type here...'"></textarea>
        </div>

        <div class="flex-1 glass rounded-[35px] flex flex-col overflow-hidden shadow-2xl">
            <div class="px-8 py-2 border-b border-white/5 bg-white/5 flex justify-between items-center text-[10px] font-black text-gray-500 uppercase tracking-widest italic">
                <span x-text="lang === 'ar' ? 'منصة المعاينة اللحظية' : 'Real-time Preview Canvas'"></span>
                <span class="text-green-500 animate-pulse">● Live Engine</span>
            </div>
            <div class="flex-1 p-5 overflow-hidden">
                <div id="live-canvas"></div>
            </div>
        </div>
    </main>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 bottom-0 w-[280px] bg-[#050505] p-10 flex flex-col z-[100] transition-transform duration-300" :class="lang === 'ar' ? 'right-0 border-l border-white/10' : 'left-0 border-r border-white/10'" x-cloak :style="menuOpen ? 'transform: translateX(0)' : (lang === 'ar' ? 'transform: translateX(100%)' : 'transform: translateX(-100%)')">
        <nav class="flex-1 space-y-6 pt-10">
            <button @click="activeModal = 'profile'; menuOpen = false" class="w-full text-right p-3 hover:text-blue-500 transition font-black flex justify-between items-center text-sm">
                <span x-text="lang === 'ar' ? 'الملف الشخصي' : 'Profile'"></span> 👤
            </button>
            <button @click="activeModal = 'about'; menuOpen = false" class="w-full text-right p-3 hover:text-blue-500 transition font-black flex justify-between items-center text-sm">
                <span x-text="lang === 'ar' ? 'من نحن' : 'About Us'"></span> ℹ️
            </button>
            
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right p-3 border border-white/5 rounded-2xl hover:bg-white/5 transition font-black flex justify-between items-center text-sm">
                <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span> 🌐
            </button>

            <button @click="exportProject()" class="w-full text-right p-4 rounded-2xl bg-green-600/10 text-green-400 border border-green-500/20 font-black flex justify-between items-center text-sm">
                <span x-text="lang === 'ar' ? 'تصدير المشروع' : 'Export Project'"></span> 📥
            </button>
        </nav>
        <div class="mt-auto text-center border-t border-white/5 pt-6 text-[9px] font-black text-gray-700 uppercase tracking-[0.2em]">صُنع بالسعودية 🇸🇦</div>
    </div>

    <div x-show="activeModal" class="fixed inset-0 z-[200] modal-bg flex items-center justify-center p-6" x-cloak x-transition>
        <div class="w-full max-w-md glass p-10 rounded-[40px] text-center border border-blue-500/30">
            <h2 class="text-2xl font-black mb-4" x-text="activeModal === 'profile' ? 'الملف الشخصي' : 'عن مَجال PRO'"></h2>
            <p class="text-gray-400 text-sm leading-relaxed mb-8" x-text="activeModal === 'profile' ? 'أنت المطور المسؤول عن هذا النظام السيادي.' : 'مَجال هو محرك برمجي يهدف لتمكين المبدعين العرب.'"></p>
            <button @click="activeModal = null" class="bg-blue-600 w-full py-4 rounded-2xl font-black hover:bg-blue-500 transition shadow-xl shadow-blue-900/30">إغلاق</button>
        </div>
    </div>

    <script>
        function majalApp() {
            return {
                menuOpen: false, mode: 'easy', lang: 'ar', activeModal: null,
                init() {
                    const saved = localStorage.getItem('majal_autosave');
                    if(saved) {
                        document.getElementById('majal-editor').value = saved;
                        setTimeout(() => MajalCore.process(), 100);
                    }
                },
                onInput(e) {
                    localStorage.setItem('majal_autosave', e.target.value);
                    MajalCore.process();
                },
                addSection(type) {
                    const editor = document.getElementById('majal-editor');
                    const html = type === 'header' ? '\n<header style="background:#1e293b; color:white; padding:20px; border-radius:15px; text-align:center; font-family:sans-serif;">\n <h2>متجري الجديد</h2>\n</header>' : '\n<section style="padding:20px; text-align:center; font-family:sans-serif;">\n <div style="background:#f1f5f9; padding:20px; border-radius:15px;">هذا القسم يوضح مميزات مشروعك</div>\n</section>';
                    editor.value += html;
                    MajalCore.process();
                },
                exportProject() {
                    const code = document.getElementById('live-canvas').innerHTML;
                    const fullHTML = `<!DOCTYPE html><html dir="rtl"><body>${code}</body></html>`;
                    const blob = new Blob([fullHTML], {type: 'text/html'});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'majal_site.html';
                    a.click();
                }
            }
        }
        const MajalCore = {
            registry: new Map(),
            process() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = ''; return; }
                this.registry.clear();
                let out = "";
                code.split('\n').forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const pts = clean.replace("عرف", "").split("=");
                        if (pts[1]) this.registry.set(pts[0].trim(), pts[1].trim().replace(/['"]+/g, ''));
                    } else { out += line + "\n"; }
                });
                this.registry.forEach((v, k) => out = out.replace(new RegExp(`{${k}}`, 'g'), v));
                canvas.innerHTML = out;
            }
        };
    </script>
</body>
</html>
