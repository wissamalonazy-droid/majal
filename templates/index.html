<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL 2.0 | المحيط البرمجي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #050505; color: #e0e0e0; }
        .editor-font { font-family: 'Fira Code', monospace; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .terminal-scroll::-webkit-scrollbar { width: 6px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-blue-900/50 pb-4">
            <h1 class="text-2xl font-bold tracking-widest text-blue-500">MAJAL 2.0 <span class="text-xs text-gray-500">المحيط البرمجي</span></h1>
            <div class="flex space-x-2 space-x-reverse">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
        </header>

        <div class="glass rounded-2xl overflow-hidden shadow-2xl">
            <textarea id="codeEditor" class="w-full h-80 bg-transparent p-6 editor-font text-blue-300 outline-none resize-none text-lg" placeholder="اكتب كودك هنا..."></textarea>
        </div>

        <div class="glass rounded-2xl p-4 h-64 overflow-y-auto terminal-scroll editor-font text-sm" id="output">
            <div class="text-gray-500">// بانتظار تشغيل المحرك...</div>
        </div>

        <button onclick="runMajal()" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center space-x-2 space-x-reverse">
            <span>تشغيل المحرك 🚀</span>
        </button>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            
            outputDiv.innerHTML = '<div class="text-blue-400 animate-pulse">🔍 جاري المعالجة...</div>';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                const lines = data.result.split('\n');
                let formattedOutput = '';

                lines.forEach(line => {
                    if (line.includes('🚨') || line.includes('❌')) {
                        formattedOutput += `<div class="bg-red-900/20 border-r-4 border-red-500 p-2 my-1 text-red-400 font-bold">${line}</div>`;
                    } else if (line.includes('🏗️')) {
                        formattedOutput += `<div class="bg-yellow-900/20 border-r-4 border-yellow-500 p-3 my-2 text-yellow-200 whitespace-pre-wrap">${line}</div>`;
                    } else if (line.includes('🔍')) {
                        formattedOutput += `<div class="bg-blue-900/20 border-r-4 border-blue-500 p-2 my-1 text-blue-300">${line}</div>`;
                    } else if (line.includes('✅')) {
                        formattedOutput += `<div class="text-green-400 p-1 font-bold">${line}</div>`;
                    } else {
                        formattedOutput += `<div class="text-gray-300 p-1">${line}</div>`;
                    }
                });

                outputDiv.innerHTML = formattedOutput;
            } catch (err) {
                outputDiv.innerHTML = `<div class="text-red-500">❌ فشل الاتصال بالمحرك</div>`;
            }
        }
    </script>
</body>
</html>
