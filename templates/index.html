<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مجال PRO — المحرك البصري للمتاجر</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d0f14; --paper: #12151c; --card: #181c26; --line: #1f2535;
  --text: #d4daf0; --bright: #eef2ff; --amber: #f5a623; --teal: #00c9a7;
  --rose: #ff5f7e; --sky: #38bdf8; --violet: #a78bfa;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--ink); color: var(--text); font-family: 'Tajawal', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* Header & Tabs */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 55px; background: var(--paper); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 32px; height: 32px; background: linear-gradient(135deg, var(--amber), var(--rose)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; }
.run-btn { background: var(--amber); color: #000; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
.run-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(245,166,35,0.4); }

/* Layout */
.workspace { display: grid; grid-template-columns: 240px 1fr 380px; flex: 1; overflow: hidden; }
.explorer { background: var(--paper); border-left: 1px solid var(--line); overflow-y: auto; }
.editor-area { display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--line); }
#editor { position: absolute; inset: 0; background: transparent; color: transparent; caret-color: var(--amber); border: none; outline: none; padding: 20px 20px 20px 50px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.7; resize: none; z-index: 3; direction: ltr; }
#hl { position: absolute; inset: 0; padding: 20px 20px 20px 50px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 1.7; pointer-events: none; z-index: 1; white-space: pre; direction: ltr; }
#lnum { position: absolute; top:0; right:0; width: 40px; padding: 20px 5px; color: #3a4460; text-align: center; border-left: 1px solid var(--line); font-family: monospace; z-index: 2; background: var(--ink); }

/* Output & Visual Shop */
.output-area { background: var(--paper); display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.output-tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
.out-tab { flex:1; padding: 10px; text-align: center; font-size: 11px; cursor: pointer; color: #5c6a8a; font-weight: 800; }
.out-tab.active { color: var(--amber); border-bottom: 2px solid var(--amber); background: var(--line); }
#output, #visual-shop { flex: 1; overflow-y: auto; padding: 15px; font-family: monospace; }
#visual-shop { background: #f1f5f9; display: none; padding: 20px; }

/* Visual Components Styles */
.v-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: #1e293b; border: 1px solid #e2e8f0; }
.v-price { color: var(--amber); font-weight: 900; font-size: 1.2em; }
.v-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 8px; margin-top: 10px; font-weight: 800; cursor: pointer; }
.v-img { width: 100%; height: 120px; background: #f8fafc; border-radius: 10px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; object-fit: cover; }
.v-header { background: #1e293b; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; font-family: 'Tajawal'; }
</style>
</head>
<body x-data="majalApp()" x-init="init()">

<div class="topbar">
  <div class="brand">
    <div class="brand-logo">م</div>
    <div class="brand-name">مَجال <em>PRO</em></div>
  </div>
  <button class="run-btn" onclick="runCode()">▶ تشغيل وبناء المتجر</button>
</div>

<div class="workspace">
  <div class="explorer">
    <div style="padding:15px; font-size:10px; color: #5c6a8a; letter-spacing:2px;">📁 ملفات المتجر</div>
    <div style="padding:10px 20px; color: var(--amber); font-size:13px; background: var(--line);">📄 main.mjl</div>
  </div>

  <div class="editor-area">
    <div id="lnum"></div>
    <div id="hl"></div>
    <textarea id="editor" spellcheck="false" dir="ltr"></textarea>
  </div>

  <div class="output-area">
    <div class="output-tabs">
      <div class="out-tab active" onclick="switchTab('run', this)">المخرجات</div>
      <div class="out-tab" onclick="switchTab('visual', this)">المتجر الحي 🛒</div>
    </div>
    <div id="output"></div>
    <div id="visual-shop"></div>
  </div>
</div>

<script>
// المحرك اللغوي (Majal Engine)
const EXAMPLES = `// لغة مجال - بناء متجر متكامل 
منتج عطر_سديم {
  اسم: "عطر سديم الملكي"
  سعر: 450
  عملة: "ريال"
  رابط_الصورة: "🧴"
  مخزون: 50
}

منتج ساعة_السيادة {
  اسم: "ساعة السيادة السوداء"
  سعر: 1200
  عملة: "ريال"
  رابط_الصورة: "⌚"
  مخزون: 10
}

أطبع("=== جاري بناء واجهة المتجر البصرية ===")
أطبع("تم استيراد المنتجات بنجاح")`;

const ed = document.getElementById('editor');
const hl = document.getElementById('hl');
const lnum = document.getElementById('lnum');
const out = document.getElementById('output');
const visual = document.getElementById('visual-shop');

function updateEditor() {
  const code = ed.value;
  hl.innerHTML = code.replace(/"([^"]*)"/g, '<span style="color:var(--teal)">"$1"</span>')
                     .replace(/\b(منتج|سلة|أطبع|دالة|إذا)\b/g, '<span style="color:var(--amber);font-weight:bold">$1</span>')
                     .replace(/\b(\d+)\b/g, '<span style="color:var(--violet)">$1</span>');
  lnum.innerHTML = Array.from({length: code.split('\n').length}, (_, i) => i + 1).join('<br>');
}

ed.addEventListener('input', updateEditor);
ed.value = EXAMPLES;
updateEditor();

function switchTab(type, el) {
  document.querySelectorAll('.out-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if(type === 'run') { out.style.display='block'; visual.style.display='none'; }
  else { out.style.display='none'; visual.style.display='block'; }
}

function runCode() {
  out.innerHTML = '<div style="color:#5c6a8a">// جاري المعالجة...</div>';
  visual.innerHTML = '<div class="v-header"><h2>مرحباً بك في متجرك</h2><p>بني بلغة مَجال السيادية</p></div>';
  
  const code = ed.value;
  // مفسر بصري بسيط (Visual Parser)
  const productRegex = /منتج\s+(\w+)\s*{([\s\S]*?)}/g;
  let match;
  
  while ((match = productRegex.exec(code)) !== null) {
    const propsRaw = match[2];
    const name = propsRaw.match(/اسم:\s*"([^"]*)"/)?.[1] || "منتج";
    const price = propsRaw.match(/سعر:\s*(\d+)/)?.[1] || "0";
    const img = propsRaw.match(/رابط_الصورة:\s*"([^"]*)"/)?.[1] || "📦";
    
    const card = document.createElement('div');
    card.className = 'v-card';
    card.innerHTML = `
      <div class="v-img">${img}</div>
      <div style="font-weight:900; font-size:16px;">${name}</div>
      <div class="v-price">${price} ريال</div>
      <button class="v-btn">إضافة للسلة 🛒</button>
    `;
    visual.appendChild(card);
  }
  
  const printRegex = /أطبع\("([^"]*)"\)/g;
  while ((match = printRegex.exec(code)) !== null) {
    const line = document.createElement('div');
    line.style.marginBottom = '5px';
    line.innerText = `> ${match[1]}`;
    out.appendChild(line);
  }
  
  // التبديل التلقائي للمتجر الحي عند التشغيل
  switchTab('visual', document.querySelectorAll('.out-tab')[1]);
}

function majalApp() { return { init() { updateEditor(); } } }
</script>
</body>
</html>
