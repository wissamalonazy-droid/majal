<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | المحيط البرمجي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #050505; color: #e0e0e0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .editor-font { font-family: 'Fira Code', monospace; }
        .terminal-scroll::-webkit-scrollbar { width: 6px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-blue-900/50 pb-4">
            <h1 class="text-3xl font-bold tracking-tighter text-blue-500 italic">MAJAL <span class="text-white">PRO</span></h1>
            <div class="text-xs text-gray-500">نظام بناء الأنظمة المتكامل</div>
        </header>

        <div class="glass rounded-2xl overflow-hidden shadow-2xl border-l-4 border-blue-600">
            <textarea id="codeEditor" class="w-full h-80 bg-transparent p-6 editor-font text-blue-300 outline-none resize-none text-lg" placeholder="عرف الاسم = 'مستشفى الفخامة' ; &#10;ابني 'مستشفى' ;"></textarea>
        </div>

        <div class="glass rounded-2xl p-4 h-64 overflow-y-auto terminal-scroll editor-font text-sm" id="output">
            <div class="text-gray-600">// بانتظار أوامر البناء...</div>
        </div>

        <button onclick="runMajal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-5 rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center space-x-3 space-x-reverse">
            <span class="text-xl">توليد النظام 🚀</span>
        </button>
    </div>

    <div id="codeModal" class="fixed inset-0 bg-black/95 hidden z-50 p-6 flex items-center justify-center backdrop-blur-md">
        <div class="bg-[#0a0f1e] w-full max-w-4xl max-h-[85vh] rounded-3xl border border-blue-500/50 shadow-2xl flex flex-col">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xl font-bold text-blue-400">📄 كود النظام المولد جاهز للنسخ</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-3xl">&times;</button>
            </div>
            <pre id="generatedCodeArea" class="p-8 overflow-auto text-green-400 editor-font text-sm whitespace-pre-wrap flex-1 bg-black/50"></pre>
            <div class="p-5 border-t border-slate-800 flex justify-between items-center">
                <button onclick="copyCode()" id="copyBtn" class="bg-blue-600 px-10 py-3 rounded-xl text-white font-bold hover:bg-blue-500 shadow-lg transition-all">نسخ الكود 📋</button>
            </div>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '<div class="text-blue-400 animate-pulse">🔍 جاري هندسة النظام...</div>';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                const lines = data.result.split('\n');
                let formattedOutput = '';

                lines.forEach(line => {
                    if (line.includes('🏗️') || line.includes('🏥') || line.includes('🏦') || line.includes('🚀')) {
                        formattedOutput += `<div onclick="openModal('${encodeURIComponent(data.result)}')" class="bg-blue-900/20 border-r-4 border-blue-500 p-4 my-2 text-blue-200 cursor-pointer hover:bg-blue-900/40 transition-all">
                            ${line} <span class="text-[10px] text-blue-500 block mt-1">(اضغط هنا لنسخ الكود المولد 🖱️)</span>
                        </div>`;
                    } else if (line.includes('✅')) {
                        formattedOutput += `<div class="text-green-400 p-1 font-bold">● ${line}</div>`;
                    } else {
                        formattedOutput += `<div class="text-gray-400 p-1">${line}</div>`;
                    }
                });
                outputDiv.innerHTML = formattedOutput;
            } catch (err) {
                outputDiv.innerHTML = `<div class="text-red-500 text-center">❌ خطأ في الاتصال بالمحرك</div>`;
            }
        }

        function openModal(encodedCode) {
            const decodedCode = decodeURIComponent(encodedCode);
            document.getElementById('generatedCodeArea').innerText = decodedCode;
            document.getElementById('codeModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('codeModal').classList.add('hidden');
        }

        function copyCode() {
            const code = document.getElementById('generatedCodeArea').innerText;
            navigator.clipboard.writeText(code);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "تم النسخ بنجاح! ✅";
            setTimeout(() => { btn.innerText = "نسخ الكود 📋"; }, 2000);
        }
    </script>
</body>
</html>
