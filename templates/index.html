<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | NUCLEUS V14</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --bg: #020617; }
        body { background: var(--bg); color: #f8fafc; font-family: 'Tajawal', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 24px; }
        #codeEditor { font-family: 'Fira Code', monospace; background: transparent; color: #93c5fd; width: 100%; padding: 25px; outline: none; border: none; font-size: 16px; line-height: 1.6; resize: none; flex: 1; }
        
        /* تحديث المحاكي الصارم */
        .preview-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: #0f172a; overflow: auto; padding: 20px; }
        .iframe-container { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: white; box-shadow: 0 0 100px rgba(0,0,0,0.7); }
        
        .mobile-view { width: 375px !important; height: 667px !important; border: 12px solid #334155; border-radius: 40px; }
        .tablet-view { width: 768px !important; height: 1024px !important; border: 12px solid #334155; border-radius: 30px; }
        .desktop-view { width: 100% !important; height: 100% !important; border: none; border-radius: 0; }
    </style>
</head>
<body x-data="{ view: 'desktop', lang: 'ar' }">

    <header class="h-[70px] flex items-center justify-between px-8 bg-black/40 border-b border-white/5">
        <h1 class="text-xl font-black text-blue-500 italic">MAJAL <span class="text-white font-light">PRO</span></h1>
        
        <div class="flex bg-white/5 p-1 rounded-2xl border border-white/10 gap-2">
            <button @click="view = 'mobile'" :class="view === 'mobile' ? 'bg-blue-600' : ''" class="px-4 py-1.5 rounded-xl text-[10px] font-bold transition-all">📱 Mobile</button>
            <button @click="view = 'tablet'" :class="view === 'tablet' ? 'bg-blue-600' : ''" class="px-4 py-1.5 rounded-xl text-[10px] font-bold transition-all">📟 Tablet</button>
            <button @click="view = 'desktop'" :class="view === 'desktop' ? 'bg-blue-600' : ''" class="px-4 py-1.5 rounded-xl text-[10px] font-bold transition-all">💻 Desktop</button>
        </div>

        <div class="w-10 h-10 rounded-full bg-blue-500/20 border border-blue-500/40 flex items-center justify-center font-bold text-xs italic">WE</div>
    </header>

    <main class="flex-1 p-6 flex flex-col gap-4 overflow-hidden">
        <div class="glass flex-1 flex flex-col overflow-hidden shadow-2xl">
            <textarea id="codeEditor" spellcheck="false" placeholder="// اكتب كودك هنا..."></textarea>
            <div id="statusBar" class="p-4 bg-black/40 text-xs border-t border-white/5 text-blue-400 font-mono">📟 النواة جاهزة</div>
        </div>
        <button onclick="runMajal()" class="bg-blue-600 hover:bg-blue-500 p-5 rounded-[2rem] font-black text-xl shadow-2xl transition-all">تشغيل النظام ⚡</button>
    </main>

    <div id="previewModal" class="fixed inset-0 z-[100] bg-black/95 hidden flex flex-col">
        <div class="p-4 bg-zinc-950 flex justify-between items-center border-b border-white/10">
            <span class="text-blue-500 font-black text-xs uppercase italic tracking-widest">Live Preview</span>
            <button onclick="document.getElementById('previewModal').classList.add('hidden')" class="text-white text-3xl leading-none">&times;</button>
        </div>
        <div class="preview-wrapper">
            <iframe id="livePreview" class="iframe-container" :class="view === 'mobile' ? 'mobile-view' : (view === 'tablet' ? 'tablet-view' : 'desktop-view')"></iframe>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const statusBar = document.getElementById('statusBar');
            if(!code.trim()) return;

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                if (data.result.toLowerCase().includes("<html")) {
                    const iframe = document.getElementById('livePreview');
                    const doc = iframe.contentWindow.document;
                    doc.open(); doc.write(data.result); doc.close();
                    document.getElementById('previewModal').classList.remove('hidden');
                } else {
                    statusBar.innerHTML = `<span class="text-blue-300">${data.result}</span>`;
                }
            } catch (e) { statusBar.innerText = "❌ خطأ اتصال"; }
        }
    </script>
</body>
</html>
