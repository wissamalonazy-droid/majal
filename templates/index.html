<script>

// =============================
// 🆕 ORDER SYSTEM
// =============================
let ORDER_ID = 1000;

class Interpreter {
  constructor() {
    this.out = [];
    this.orders = [];
    this.global = new Env();
    this._setupBuiltins();
  }

  execBuiltinCall(node, env) {
    const args = node.args.map(a => this.eval(a, env));

    switch(node.kind) {

      // =============================
      // 🆕 ADD TO CART (unchanged)
      // =============================
      case 'Add': {
        const [cart, prod, qty=1] = args;
        cart._items.push({ prod, qty });
        this.emit(`🛒 ${prod.اسم} × ${qty}`, 'ok');
        return;
      }

      // =============================
      // 🔥 NEW CHECKOUT SYSTEM
      // =============================
      case 'Checkout': {
        const [cart] = args;

        let total = 0;

        for (const item of cart._items) {
          if (item.prod.مخزون < item.qty) {
            throw new Error(`المخزون غير كافٍ: ${item.prod.اسم}`);
          }

          const sub = item.prod.سعر * item.qty;
          total += sub;

          // 🆕 خصم المخزون
          item.prod.مخزون -= item.qty;
        }

        const order = {
          id: ++ORDER_ID,
          total,
          items: cart._items,
          status: "تم"
        };

        this.orders.push(order);

        this.emit(`🧾 طلب رقم #${order.id}`, 'sec');
        this.emit(`💰 الإجمالي: ${total}`, 'price');

        return order;
      }

      // =============================
      // ⭐ REVIEWS SYSTEM
      // =============================
      case 'Rate': {
        const [prod, stars, comment] = args;

        if (!prod.تقييمات) prod.تقييمات = [];

        prod.تقييمات.push({ stars, comment });

        this.emit(`⭐ تقييم ${stars}/5 على ${prod.اسم}`, 'ok');
        return;
      }

      // =============================
      // 📊 REPORT (improved)
      // =============================
      case 'Report': {
        const [obj] = args;

        this.emit(`📊 تقرير`, 'sec');

        if (obj._type === 'cart') {
          let total = 0;

          for (const item of obj._items) {
            const sub = item.qty * item.prod.سعر;
            total += sub;

            this.emit(`${item.prod.اسم} × ${item.qty} = ${sub}`, 'val');
          }

          this.emit(`الإجمالي: ${total}`, 'price');
        }

        return;
      }
    }
  }

}

// =============================
// 🆕 TRY / CATCH SUPPORT
// =============================
Parser.prototype.parseTry = function() {
  this.advance(); // حاول
  const tryBlock = this.parseBlock();

  this.expect('امسك');
  const catchBlock = this.parseBlock();

  return { type:'Try', tryBlock, catchBlock };
};

Interpreter.prototype.exec = function(node, env) {

  if (node.type === 'Try') {
    try {
      this.execBlock(node.tryBlock.body, env);
    } catch (e) {
      this.execBlock(node.catchBlock.body, env);
    }
    return;
  }

  return this._execOriginal(node, env);
};

</script>
