<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL 2.0.1 | PRO INTERFACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top right, #0a192f, #020617); 
            color: #f8fafc; 
            font-family: 'Tajawal', sans-serif;
            min-height: 100 screen;
        }
        .pro-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(59, 130, 246, 0.2); 
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .editor-area { 
            font-family: 'Consolas', monospace; 
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .btn-grad {
            background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
            transition: all 0.3s ease;
        }
        .btn-grad:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px #2563eb;
        }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-5xl mx-auto space-y-8">
        <div class="flex justify-between items-end border-b border-white/10 pb-6">
            <div>
                <h1 class="text-4xl font-black text-blue-500 tracking-tighter neon-glow">MAJAL <span class="text-white">2.0.1</span></h1>
                <p class="text-gray-400 text-sm mt-2 font-mono">NEXT-GEN PROGRAMMING INTERFACE</p>
            </div>
            <div class="flex space-x-2 space-x-reverse">
                <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
            </div>
        </div>

        <div class="pro-card p-2">
            <textarea id="codeEditor" class="w-full h-80 p-8 editor-area text-blue-400 text-xl outline-none resize-none" placeholder="// اكتب أوامرك هنا يا وسام..."></textarea>
        </div>

        <div id="output" class="pro-card p-6 min-h-[120px] border-r-4 border-blue-500 bg-slate-900/40 text-sm leading-relaxed overflow-hidden">
            <span class="text-slate-500 italic">// بانتظار إشارة البدء...</span>
        </div>

        <button onclick="runMajal()" class="w-full btn-grad py-5 rounded-2xl font-bold text-xl tracking-widest uppercase flex items-center justify-center space-x-4 space-x-reverse">
            <span>تشغيل المحرك</span>
            <span class="text-2xl">⚡</span>
        </button>
    </div>

    <div id="copyModal" class="fixed inset-0 bg-slate-950/95 hidden z-50 flex flex-col p-6 md:p-12 backdrop-blur-xl">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-blue-400">📄 الكود المولد</h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white text-4xl">&times;</button>
        </div>
        <pre id="modalText" class="bg-black/50 p-8 rounded-3xl border border-white/10 flex-1 overflow-auto text-emerald-400 font-mono text-lg whitespace-pre-wrap"></pre>
        <div class="mt-8 flex justify-center">
            <button onclick="copyBtn()" id="copyBtn" class="bg-white text-black px-12 py-4 rounded-2xl font-black text-lg hover:bg-blue-500 hover:text-white transition-all">نسخ الكود 📋</button>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '<div class="flex items-center space-x-2 space-x-reverse"><div class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></div><span class="text-blue-400">جاري الهندسة...</span></div>';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                outputDiv.innerHTML = `
                    <div onclick="openModal('${encodeURIComponent(data.result)}')" class="cursor-pointer group relative">
                        <pre class="text-slate-200">${data.result}</pre>
                        <div class="absolute top-0 left-0 bg-blue-500/10 px-2 py-1 rounded text-[10px] text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity">انقر للنسخ 🖱️</div>
                    </div>`;
            } catch (e) { outputDiv.innerHTML = '<span class="text-red-500">❌ خطأ في النظام</span>'; }
        }

        function openModal(c) {
            document.getElementById('modalText').innerText = decodeURIComponent(c);
            document.getElementById('copyModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('copyModal').classList.add('hidden'); }

        function copyBtn() {
            const text = document.getElementById('modalText').innerText;
            navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "تم الحفظ في الحافظة! ✅";
            setTimeout(() => { btn.innerText = "نسخ الكود 📋"; }, 2000);
        }
    </script>
</body>
</html>
