<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL PRO | INSTANT GEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'monospace'; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 22px; width: 100%; height: 100%; padding: 40px; font-weight: bold; }
        #live-canvas { background: #fff; border-radius: 35px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; transition: all 0.3s ease; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()">

    <header class="h-[70px] flex items-center justify-between px-10 border-b border-white/5 bg-black/50 z-50">
        <h1 class="text-2xl font-black italic text-blue-500 italic">MAJAL <span class="text-white font-light text-sm">INSTANT GEN</span></h1>
        <div class="flex items-center gap-3">
            <span class="text-[10px] font-black text-green-500 uppercase tracking-widest animate-pulse">● المحرك متصل وشغال</span>
        </div>
    </header>

    <main class="flex flex-col h-[calc(100vh-70px)] p-6 gap-6">
        <div class="flex-1 glass rounded-[40px] flex flex-col overflow-hidden border border-blue-500/20">
            <textarea id="majal-editor" @input="onInput($event)" placeholder="مثال: متجر عطور ألوان أحمر وأبيض"></textarea>
        </div>

        <div class="flex-1 glass rounded-[40px] flex flex-col overflow-hidden">
            <div id="live-canvas">
                <div class="flex items-center justify-center h-full text-gray-500 italic">اكتب مواصفات متجرك ليبدأ البناء اللحظي...</div>
            </div>
        </div>
    </main>

    <script>
        function majalApp() {
            return {
                init() { this.generate(); },
                onInput() { this.generate(); },
                generate() {
                    const input = document.getElementById('majal-editor').value;
                    const canvas = document.getElementById('live-canvas');
                    
                    if (!input.includes("متجر")) return;

                    // محرك تحليل الألوان الفوري
                    const colorMap = {
                        'أحمر': '#ef4444', 'ازرق': '#3b82f6', 'أزرق': '#3b82f6', 'اصفر': '#eab308', 
                        'أصفر': '#eab308', 'ابيض': '#ffffff', 'أبيض': '#ffffff', 'اسود': '#0f172a', 'أسود': '#0f172a',
                        'بني': '#78350f', 'البني': '#78350f'
                    };

                    let primary = '#2563eb'; // افتراضي
                    let bg = '#ffffff'; // افتراضي
                    
                    Object.keys(colorMap).forEach(key => {
                        if (input.includes(key)) {
                            if (key.includes('بيض')) bg = colorMap[key];
                            else primary = colorMap[key];
                        }
                    });

                    let type = "متجر سيادي";
                    let emoji = "📦";
                    if (input.includes("عطور")) { type = "بوتيك عطور فاخرة"; emoji = "🧴"; }
                    if (input.includes("اشتراك")) { type = "متجر اشتراكات رقمية"; emoji = "⚡"; }

                    // البناء اللحظي (بدون انتظار)
                    canvas.innerHTML = `
                        <div style="background: ${bg}; min-height: 100%; transition: 0.3s;" dir="rtl" class="p-8">
                            <nav class="flex justify-between items-center mb-8 border-b pb-4" style="border-color: ${primary}33">
                                <h2 class="text-2xl font-black" style="color: ${primary}">${type}</h2>
                                <div class="w-10 h-10 rounded-full flex items-center justify-center" style="background: ${primary}22; color: ${primary}">🛒</div>
                            </nav>
                            
                            <div class="rounded-[30px] p-12 mb-8 text-center text-white shadow-xl shadow-inner" style="background: linear-gradient(135deg, ${primary}, ${primary}cc)">
                                <h1 class="text-4xl font-black mb-4">أهلاً بك في عالمك الجديد</h1>
                                <p class="opacity-80">تم بناء هذا المتجر بلغة مَجال في 0.2 ثانية</p>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                ${[1, 2].map(i => `
                                    <div class="bg-white p-6 rounded-[30px] border shadow-sm" style="border-color: ${primary}11">
                                        <div class="h-32 rounded-2xl mb-4 flex items-center justify-center text-4xl bg-gray-50">${emoji}</div>
                                        <h3 class="font-black text-lg mb-4">منتج مميز رقم ${i}</h3>
                                        <button class="w-full py-4 rounded-2xl font-black text-white" style="background: ${primary}">إضافة للسلة</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
