<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL GLOBAL ENGINE | منصة مَجال العالمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --bg: #020617; }
        body { 
            background: radial-gradient(circle at top right, #0f172a, var(--bg)); 
            color: #f8fafc; font-family: 'Tajawal', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .header {
            height: 70px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .editor-container {
            background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 24px;
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #codeEditor {
            flex: 1; background: transparent; color: #93c5fd;
            font-family: 'Fira Code', 'Consolas', monospace;
            width: 100%; padding: 25px; outline: none; border: none;
            font-size: 18px; line-height: 1.6; resize: none;
        }

        .status-bar {
            background: rgba(0, 0, 0, 0.4); padding: 15px 25px;
            font-size: 13px; border-top: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 50px; display: flex; align-items: center;
        }

        .btn-run {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            padding: 16px; border-radius: 18px; font-weight: 900;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
        }
        .btn-run:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(14, 165, 233, 0.5); }
        .btn-run:active { scale: 0.98; }

        /* Modal Styles */
        #previewModal {
            position: fixed; inset: 0; z-index: 100; display: none;
            flex-direction: column; background: #000;
        }
        .modal-header {
            background: #0a0a0a; padding: 15px 25px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #222;
        }
        iframe { width: 100%; flex: 1; border: none; background: #fff; }
    </style>
</head>
<body>

    <header class="header">
        <div class="flex items-center gap-4">
            <div class="flex gap-1.5">
                <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
            </div>
            <h1 class="text-xl font-black tracking-tighter italic text-blue-500">MAJAL <span class="text-white">GLOBAL</span></h1>
        </div>
        <div class="hidden md:block text-[10px] text-gray-500 font-mono tracking-[0.3em] uppercase">Multi-Language Compiler 7.0</div>
    </header>

    <main class="main-content">
        <div class="editor-container">
            <textarea id="codeEditor" spellcheck="false" placeholder="// أدخل أوامر مَجال البرمجية هنا (عربي أو إنجليزي)..."></textarea>
            
            <div class="status-bar" id="statusBar">
                <span class="text-gray-500">المحرك في وضع الاستعداد..</span>
            </div>
        </div>

        <button onclick="runMajal()" class="btn-run text-white flex items-center justify-center gap-3">
            <span id="btnText">تشغيل المحرك</span>
            <span class="text-xl">⚡</span>
        </button>
    </main>

    <div id="previewModal">
        <div class="modal-header">
            <span class="text-blue-500 font-bold text-sm tracking-widest uppercase italic">Live Architecture View</span>
            <button onclick="closePreview()" class="text-gray-500 hover:text-white text-3xl">&times;</button>
        </div>
        <iframe id="livePreview"></iframe>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const statusBar = document.getElementById('statusBar');
            const btnText = document.getElementById('btnText');
            
            if(!code.trim()) {
                statusBar.innerHTML = '<span class="text-yellow-500">⚠️ من فضلك اكتب كوداً لتشغيله.</span>';
                return;
            }

            // بداية الفحص
            btnText.innerText = "جاري التحليل...";
            statusBar.innerHTML = '<span class="text-blue-400 animate-pulse">🔄 جاري فحص المنطق البرمجي...</span>';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                // رادار كشف الأخطاء
                if (data.result.includes("❌") || data.result.includes("⚠️")) {
                    statusBar.innerHTML = `<div class="text-red-400 font-medium leading-relaxed">${data.result.replace(/\n/g, '<br>')}</div>`;
                } else {
                    // إذا الكود سليم
                    statusBar.innerHTML = `<span class="text-green-500 font-bold">✅ تم التحقق بنجاح!</span> <span class="text-gray-500 mr-2">${data.result}</span>`;
                    
                    const htmlCode = extractHTML(data.result);
                    if (htmlCode) {
                        const iframe = document.getElementById('livePreview');
                        const doc = iframe.contentWindow.document;
                        doc.open(); doc.write(htmlCode); doc.close();
                        setTimeout(() => {
                            document.getElementById('previewModal').style.display = 'flex';
                        }, 500);
                    }
                }
            } catch (e) {
                statusBar.innerHTML = '<span class="text-red-500">❌ فشل الاتصال بالمحرك. تأكد من تشغيل السيرفر.</span>';
            }
            btnText.innerText = "تشغيل المحرك";
        }

        function extractHTML(text) {
            const start = text.indexOf('<!DOCTYPE html>');
            const end = text.lastIndexOf('</html>') + 7;
            if (start !== -1 && end !== -1) return text.substring(start, end);
            return null;
        }

        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
        }

        // دعم اختصار CTRL + Enter للتشغيل السريع
        document.getElementById('codeEditor').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') runMajal();
        });
    </script>
</body>
</html>
