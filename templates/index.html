<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'Fira Code', monospace; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 16px; width: 100%; height: 100%; padding: 20px; }
        #live-canvas { background: #ffffff; color: #000; border-radius: 20px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; }
        .scroll-area { overflow-y: auto; height: 100%; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="{ 
    menuOpen: false, 
    mode: 'pro', 
    lang: 'ar',
    translations: {
        ar: { profile: 'الملف الشخصي', about: 'من نحن', easy: 'سهل', pro: 'معقد', placeholder: '// اكتب كودك هنا...', status: 'جاهز' },
        en: { profile: 'Profile', about: 'About Us', easy: 'Easy', pro: 'Professional', placeholder: '// Type your code here...', status: 'Ready' }
    }
}" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <header class="h-[65px] flex items-center justify-between px-8 bg-black/50 border-b border-white/5 z-50">
        <div class="flex items-center gap-6">
            <button @click="menuOpen = true" class="text-2xl text-blue-500">•••</button>
            <h1 class="text-2xl font-black italic tracking-tighter text-blue-500">MAJAL <span class="text-white font-light text-sm">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-5 py-1.5 rounded-lg text-[10px] font-bold transition-all" x-text="translations[lang].easy"></button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-5 py-1.5 rounded-lg text-[10px] font-bold transition-all" x-text="translations[lang].pro"></button>
        </div>
    </header>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 bottom-0 w-[300px] bg-[#050505] border-white/10 p-8 flex flex-col z-[100]" 
         :class="lang === 'ar' ? 'right-0 border-l' : 'left-0 border-r'"
         x-cloak x-transition:enter="transition transform duration-300" 
         :x-transition:enter-start="lang === 'ar' ? 'translate-x-full' : '-translate-x-full'" 
         x-transition:enter-end="translate-x-0">
        
        <div class="mb-10">
            <div class="w-14 h-14 rounded-2xl bg-blue-600 mb-4 flex items-center justify-center font-black text-2xl">M</div>
            <h3 class="font-black text-xl" x-text="translations[lang].profile"></h3>
        </div>

        <nav class="flex-1 space-y-2">
            <button class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition font-bold" x-text="translations[lang].profile"></button>
            <button class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition font-bold" x-text="translations[lang].about"></button>
            
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right p-3 rounded-xl hover:bg-white/5 border border-white/10 font-bold flex justify-between items-center">
                <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span> 🌐
            </button>
        </nav>

        <div class="mt-auto pt-6 border-t border-white/5 text-center">
            <p class="text-[10px] font-black text-blue-500 tracking-[0.2em] mb-1">MADE IN SAUDI ARABIA</p>
            <p class="text-[9px] text-gray-600 font-bold uppercase">صُنع في المملكة العربية السعودية 🇸🇦</p>
        </div>
    </div>

    <main class="flex h-[calc(100vh-65px)] p-4 gap-4">
        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div class="px-6 py-3 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <span class="text-[10px] font-black text-blue-500 uppercase" x-text="mode === 'easy' ? 'BEGINNER' : 'PROFESSIONAL'"></span>
                <div class="flex gap-1.5"><div class="w-2 h-2 rounded-full bg-red-500"></div><div class="w-2 h-2 rounded-full bg-yellow-500"></div><div class="w-2 h-2 rounded-full bg-green-500"></div></div>
            </div>
            <textarea id="majal-editor" oninput="MajalCore.process()" :placeholder="translations[lang].placeholder"></textarea>
        </div>

        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div class="px-6 py-3 border-b border-white/5 bg-white/5 flex justify-between items-center text-[10px] font-black text-gray-500 uppercase">
                <span>Canvas</span>
                <span class="text-green-500" x-text="translations[lang].status"></span>
            </div>
            <div class="flex-1 p-4 scroll-area">
                <div id="live-canvas"></div>
            </div>
        </div>
    </main>

    <script>
        const MajalCore = {
            registry: new Map(),
            process: function() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = ''; return; }
                
                this.registry.clear();
                let htmlOutput = "";
                const lines = code.split('\n');

                lines.forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const parts = clean.replace("عرف", "").split("=");
                        if (parts[1]) {
                            this.registry.set(parts[0].trim(), parts[1].trim().replace(/['"]+/g, ''));
                        }
                    } else { htmlOutput += line + "\n"; }
                });

                this.registry.forEach((v, k) => {
                    htmlOutput = htmlOutput.replace(new RegExp(`{${k}}`, 'g'), v);
                });
                canvas.innerHTML = htmlOutput;
            }
        };
    </script>
</body>
</html>
