<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | ALL-IN-ONE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'Fira Code', monospace; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 16px; width: 100%; height: 100%; padding: 20px; }
        #live-canvas { background: #ffffff; color: #000; border-radius: 20px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; transition: all 0.3s; }
        .color-dot { width: 18px; height: 18px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
        .color-dot:hover { transform: scale(1.2); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <header class="h-[60px] flex items-center justify-between px-8 bg-black/50 border-b border-white/5 z-50">
        <div class="flex items-center gap-4">
            <button @click="menuOpen = true" class="text-2xl text-blue-500">•••</button>
            <h1 class="text-xl font-black italic text-blue-500 tracking-tighter">MAJAL <span class="text-white font-light text-xs">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-5 py-1 rounded-lg text-[10px] font-bold transition-all">سهل</button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-5 py-1 rounded-lg text-[10px] font-bold transition-all">معقد</button>
        </div>
    </header>

    <main class="flex flex-col h-[calc(100vh-60px)] p-4 gap-4">
        
        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden relative border border-white/5">
            <div class="px-6 py-2 bg-white/5 border-b border-white/5 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">المحرر الذكي</span>
                    <button @click="formatCode()" class="text-[10px] bg-white/5 px-2 py-1 rounded hover:bg-blue-600 transition">🧹 تنسيق الكود</button>
                </div>
                <div x-show="mode === 'easy'" class="flex gap-1.5 items-center">
                    <span class="text-[9px] text-gray-500 ml-1">الألوان:</span>
                    <div @click="addColor('#2563eb')" class="color-dot bg-blue-600"></div>
                    <div @click="addColor('#ef4444')" class="color-dot bg-red-600"></div>
                    <div @click="addColor('#10b981')" class="color-dot bg-green-600"></div>
                    <div @click="addColor('#f59e0b')" class="color-dot bg-amber-500"></div>
                    <div @click="addColor('#000000')" class="color-dot bg-black"></div>
                </div>
            </div>
            <textarea id="majal-editor" @input="onInput($event)" placeholder="// ابدأ بكتابة كودك هنا..."></textarea>
        </div>

        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden relative border border-white/5">
            <div class="px-6 py-2 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-black text-gray-500 uppercase">المعاينة الحية</span>
                </div>
                <button @click="inspectMode = !inspectMode" :class="inspectMode ? 'text-blue-500' : 'text-gray-500'" class="text-[10px] font-bold transition">
                   🔍 وضع الفحص: <span x-text="inspectMode ? 'مفعل' : 'معطل'"></span>
                </button>
            </div>
            <div class="flex-1 p-4 overflow-hidden relative">
                <div id="live-canvas" @click="inspectElement($event)"></div>
            </div>
        </div>
    </main>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 bottom-0 w-[280px] bg-[#050505] p-10 flex flex-col z-[100] transition-transform duration-300" :class="lang === 'ar' ? 'right-0 border-l border-white/10' : 'left-0 border-r border-white/10'" x-cloak :style="menuOpen ? 'transform: translateX(0)' : (lang === 'ar' ? 'transform: translateX(100%)' : 'transform: translateX(-100%)')">
        <nav class="flex-1 space-y-4 pt-10">
            <button @click="activeModal = 'profile'; menuOpen = false" class="w-full text-right p-4 rounded-xl hover:bg-white/5 transition font-bold flex justify-between items-center"><span>الملف الشخصي</span> 👤</button>
            <button @click="activeModal = 'about'; menuOpen = false" class="w-full text-right p-4 rounded-xl hover:bg-white/5 transition font-bold flex justify-between items-center"><span>من نحن</span> ℹ️</button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right p-4 rounded-xl border border-white/5 font-bold flex justify-between items-center hover:bg-white/5"> <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span> 🌐 </button>
            <button @click="exportProject()" class="w-full text-right p-4 rounded-xl bg-green-600/10 text-green-400 border border-green-500/20 font-black flex justify-between items-center"><span>تصدير الموقع</span> 📥</button>
        </nav>
    </div>

    <div x-show="activeModal" class="fixed inset-0 z-[200] bg-black/90 flex items-center justify-center p-6" x-cloak x-transition>
        <div class="w-full max-w-md glass p-10 rounded-[40px] text-center border border-blue-500/30">
            <h2 class="text-2xl font-black mb-4 text-blue-500" x-text="activeModal === 'profile' ? 'الملف الشخصي' : 'من نحن'"></h2>
            <p class="text-gray-300 text-sm mb-8" x-text="activeModal === 'profile' ? 'أنت المطور المسؤول عن هذا النظام.' : 'مَجال هو محرك برمجي عربي سيادي.'"></p>
            <button @click="activeModal = null" class="bg-blue-600 w-full py-4 rounded-2xl font-black transition">إغلاق</button>
        </div>
    </div>

    <script>
        function majalApp() {
            return {
                menuOpen: false, mode: 'pro', lang: 'ar', activeModal: null, inspectMode: false,
                init() {
                    const saved = localStorage.getItem('majal_autosave');
                    if(saved) { document.getElementById('majal-editor').value = saved; setTimeout(() => MajalCore.process(), 100); }
                },
                onInput(e) { localStorage.setItem('majal_autosave', e.target.value); MajalCore.process(); },
                formatCode() {
                    const editor = document.getElementById('majal-editor');
                    let lines = editor.value.split('\n').map(l => l.trim()).filter(l => l !== "");
                    editor.value = lines.join('\n');
                    MajalCore.process();
                },
                addColor(hex) {
                    const editor = document.getElementById('majal-editor');
                    editor.setRangeText(hex, editor.selectionStart, editor.selectionEnd, 'end');
                    MajalCore.process();
                },
                inspectElement(e) {
                    if(!this.inspectMode) return;
                    e.target.style.outline = "2px dashed #2563eb";
                    alert("العنصر المختار: " + e.target.tagName);
                    setTimeout(() => e.target.style.outline = "none", 2000);
                },
                exportProject() {
                    const code = document.getElementById('live-canvas').innerHTML;
                    const blob = new Blob([code], {type: 'text/html'});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'index.html';
                    a.click();
                }
            }
        }
        const MajalCore = {
            registry: new Map(),
            process() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = ''; return; }
                this.registry.clear();
                let out = "";
                code.split('\n').forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const pts = clean.replace("عرف", "").split("=");
                        if (pts[1]) this.registry.set(pts[0].trim(), pts[1].trim().replace(/['"]+/g, ''));
                    } else { out += line + "\n"; }
                });
                this.registry.forEach((v, k) => out = out.replace(new RegExp(`{${k}}`, 'g'), v));
                canvas.innerHTML = out;
            }
        };
    </script>
</body>
</html>
