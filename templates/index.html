<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJAL UNRESTRICTED v23</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    :root { --bg: #020408; --panel: #0b0e14; --accent: #f5a623; --border: #1e2533; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: #e5e7eb; font-family: 'Tajawal', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { height: 60px; background: var(--panel); border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
    .build-btn { background: var(--accent); color: #000; border: none; padding: 10px 30px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.3s; }

    .main-layout { display: flex; flex-direction: column; flex: 1; }
    .preview-pane { height: 50%; background: #000; display: flex; justify-content: center; padding: 15px; border-bottom: 2px solid var(--border); }
    #viewport { width: 100%; max-width: 1000px; background: #fff; border-radius: 20px; border: none; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    
    .editor-pane { height: 50%; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
    .pane { background: var(--bg); display: flex; flex-direction: column; }
    .pane-label { padding: 10px 20px; font-size: 10px; font-weight: 900; background: var(--panel); color: #4b5563; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    
    #prompt-input { flex: 1; background: transparent; color: var(--accent); border: none; outline: none; padding: 25px; font-size: 18px; font-weight: 800; resize: none; line-height: 1.6; }
    #code-output { flex: 1; background: #010101; color: #10b981; border: none; outline: none; padding: 25px; font-family: 'Fira Code', monospace; font-size: 12px; direction: ltr; text-align: left; }
</style>
</head>
<body>

<header>
    <div style="font-weight:900; color:var(--accent);">MAJAL <span style="color:#fff; font-weight:300;">UNRESTRICTED</span></div>
    <button class="btn-build build-btn" onclick="unrestrictedBuild()">⚡ إطلاق البناء الشامل</button>
</header>

<div class="main-layout">
    <div class="preview-pane"><iframe id="viewport"></iframe></div>
    <div class="editor-pane">
        <div class="pane">
            <div class="pane-label">اكتب "أي شيء" يدور بذهنك للمتجر</div>
            <textarea id="prompt-input">متجر سديم، خلفية سوداء فخمة، أزرار ذهبية، الخط عريض جداً، الحواف مثل الدائرة، المنتجات كبيرة</textarea>
        </div>
        <div class="pane">
            <div class="pane-label">الكود المتحرر (بدون قيود) <span style="color:var(--accent); cursor:pointer;" onclick="copyCode()">[نسخ]</span></div>
            <textarea id="code-output" readonly></textarea>
        </div>
    </div>
</div>

<script>
function unrestrictedBuild() {
    const input = document.getElementById('prompt-input').value.trim();
    if(!input) return;

    // --- مفسر الذكاء البصري (Visual Interpreter) ---
    // هذا المحرك لا يبحث عن كلمات ثابتة بل يبحث عن "تأثيرات" (Effects)
    
    const storeName = input.match(/متجر\s+([\u0621-\u064A0-9]+)/)?.[1] || "متجر جديد";

    // 1. معالج الألوان المرن
    const colors = {'أسود':'#000','ذهبي':'#d4af37','أبيض':'#fff','أزرق':'#2563eb','أحمر':'#ef4444','رمادي':'#374151','بني':'#78350f','فضي':'#c0c0c0'};
    let bg = '#fff', primary = '#2563eb', text = '#000';
    
    Object.keys(colors).forEach(c => {
        if(input.includes(c)) {
            if(c === 'أسود') { bg = '#000'; text = '#fff'; }
            else if(c === 'أبيض') { bg = '#fff'; text = '#000'; }
            else primary = colors[c];
        }
    });

    // 2. معالج الأبعاد والهندسة (الحواف، الخطوط، الأحجام)
    let radius = input.includes('دائرة') ? '50px' : (input.includes('حواف') ? '15px' : '0px');
    let fontSize = input.includes('عريض') ? '900' : '400';
    let cardSize = input.includes('كبيرة') ? '400px' : '280px';
    let shadow = input.includes('فخمة') ? '0 25px 50px rgba(0,0,0,0.5)' : 'none';

    // 3. توليد الكود الصافي بناءً على "وصفك"
    const html = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal'; background: ${bg}; color: ${text}; margin: 0; padding-bottom: 50px; }
        header { background: ${primary}; padding: 80px 20px; text-align: center; color: ${primary==='#fff'?'#000':'#fff'}; box-shadow: ${shadow}; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(${cardSize}, 1fr)); gap: 30px; padding: 40px; }
        .card { background: ${bg==='#000'?'#111':'#f8f8f8'}; border-radius: ${radius}; padding: 40px; text-align: center; border: 2px solid ${primary}33; box-shadow: ${shadow}; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: ${primary}; }
        h1 { font-weight: ${fontSize}; font-size: 50px; margin: 0; }
        .price { color: ${primary}; font-weight: 900; font-size: 30px; margin: 20px 0; }
        button { background: ${primary}; color: white; border: none; padding: 18px; border-radius: ${radius}; width: 100%; font-weight: 900; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>
    <header><h1>${storeName}</h1><p>وصف متجرك كما طلبته بالملي متر</p></header>
    <div class="grid">
        <div class="card"><div style="font-size:80px">🧴</div><h3>منتج سديم</h3><div class="price">450 ريال</div><button>إضافة للسلة</button></div>
        <div class="card"><div style="font-size:80px">🧴</div><h3>منتج السيادة</h3><div class="price">320 ريال</div><button>إضافة للسلة</button></div>
    </div>
</body>
</html>`;

    document.getElementById('code-output').value = html;
    const viewport = document.getElementById('viewport');
    viewport.contentWindow.document.open();
    viewport.contentWindow.document.write(html);
    viewport.contentWindow.document.close();
}

function copyCode() {
    const code = document.getElementById('code-output');
    code.select();
    document.execCommand('copy');
    alert("تم نسخ الكود السيادي!");
}
</script>
</body>
</html>
