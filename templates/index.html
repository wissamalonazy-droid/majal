<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | التدريج السيادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; overflow: hidden; height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .editor-bg { background: #050505; }
        /* تصميم المعاينة الحية الجانبية */
        #live-canvas { background: white; border-radius: 20px; width: 100%; height: 100%; overflow: auto; transition: 0.3s; }
        .sidebar-menu { transition: transform 0.3s ease; z-index: 100; }
    </style>
</head>
<body x-data="{ menuOpen: false, mode: 'pro', lang: 'ar' }">

    <header class="h-[65px] flex items-center justify-between px-6 bg-black/40 border-b border-white/5">
        <div class="flex items-center gap-4">
            <button @click="menuOpen = true" class="text-2xl text-blue-500 hover:scale-110 transition">•••</button>
            <h1 class="text-xl font-black italic tracking-tighter text-blue-500">MAJAL <span class="text-white font-light text-sm">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-4 py-1 rounded-lg text-[10px] font-bold transition">سهل (مبتدئ)</button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-4 py-1 rounded-lg text-[10px] font-bold transition">معقد (محترف)</button>
        </div>
    </header>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[99]" @click="menuOpen = false" x-transition.opacity></div>
    <div x-show="menuOpen" 
         class="fixed top-0 right-0 w-[280px] h-full bg-[#050505] border-l border-white/10 sidebar-menu p-6 flex flex-col z-[100]"
         x-transition:enter="transform translate-x-full" x-transition:enter-end="transform translate-x-0"
         x-transition:leave="transform translate-x-0" x-transition:leave-end="transform translate-x-full">
        
        <div class="mb-10 pt-4">
            <div class="w-12 h-12 rounded-full bg-blue-600 mb-3 flex items-center justify-center font-bold text-xl shadow-lg shadow-blue-900/40">M</div>
            <h3 class="font-black text-lg">مطور مَجال</h3>
            <p class="text-xs text-gray-500">تم تسجيل الدخول بنجاح</p>
        </div>

        <nav class="flex-1 space-y-4">
            <button class="w-full text-right flex items-center gap-3 py-2 hover:text-blue-400 transition"><span>👤</span> الملف الشخصي</button>
            <button class="w-full text-right flex items-center gap-3 py-2 hover:text-blue-400 transition"><span>ℹ️</span> من نحن</button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right flex items-center gap-3 py-2 hover:text-blue-400 transition">
                <span>🌐</span> <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span>
            </button>
        </nav>

        <div class="mt-auto border-t border-white/5 pt-6">
            <p class="text-[10px] font-black text-blue-500 mb-2">SAUDI ARABIA 🇸🇦</p>
            <p class="text-[10px] text-gray-600 font-bold tracking-widest uppercase">صُنع بالسعودية</p>
        </div>
    </div>

    <main class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <div class="flex-1 glass rounded-[24px] flex flex-col overflow-hidden">
            <div class="p-4 bg-white/5 border-b border-white/5 flex justify-between items-center text-[10px] font-bold text-gray-500 uppercase tracking-widest">
                <span>المحرر البرمجي</span>
                <span class="text-blue-500">v1.0 (NUCLEUS)</span>
            </div>
            <textarea id="majal-editor" oninput="MajalCore.process()" class="flex-1 bg-transparent p-6 outline-none font-mono text-blue-300 resize-none text-lg" placeholder="// ابدأ بكتابة كود مَجال هنا..."></textarea>
        </div>

        <div class="w-1/3 glass rounded-[24px] p-4 flex flex-col gap-4">
            <div class="text-[10px] font-bold text-gray-500 uppercase tracking-widest flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> المعاينة اللحظية
            </div>
            <div id="live-canvas" class="flex-1">
                </div>
        </div>

    </main>

    <script>
        const MajalCore = {
            registry: new Map(),
            
            process: function() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                this.registry.clear();
                
                let htmlOutput = "";
                const lines = code.split('\n');

                lines.forEach(line => {
                    const clean = line.trim();
                    // تدريج 1: تعريف المتغيرات
                    if (clean.startsWith("عرف")) {
                        const parts = clean.replace("عرف", "").split("=");
                        if (parts[1]) this.registry.set(parts[0].trim(), eval(parts[1].trim().replace(/"/g, "'")));
                    } 
                    // تدريج 2: بناء العناصر (اللغة الأم)
                    else {
                        htmlOutput += line + "\n";
                    }
                });

                // تدريج 3: المعالجة اللحظية للاستبدال
                this.registry.forEach((v, k) => {
                    htmlOutput = htmlOutput.replace(new RegExp(`{${k}}`, 'g'), v);
                });

                canvas.innerHTML = htmlOutput;
            }
        };
    </script>
</body>
</html>
