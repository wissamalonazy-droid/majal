<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرك مَجال | بيئة التطوير</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: #e2e8f0; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #codeEditor {
            background: #0a0a0a;
            color: #3b82f6;
            font-family: 'Consolas', monospace;
            resize: none;
            border: 1px solid #1e293b;
        }
        pre {
            background: #000;
            padding: 20px;
            border-radius: 15px;
            color: #94a3b8;
            font-size: 13px;
            overflow-x: auto;
            border: 1px solid #111;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-white mb-2 tracking-tighter uppercase">محرك مَجال <span class="text-blue-500">2.0.8</span></h1>
            <p class="text-gray-500 text-sm italic">بيئة تطوير وسام الخاصة - هندسة الواجهات الذكية</p>
        </header>

        <div class="glass-card p-6 rounded-[2.5rem] shadow-2xl">
            <textarea id="codeEditor" class="w-full h-64 p-6 rounded-3xl mb-6 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all" placeholder="اكتب أوامر مَجال هنا..."></textarea>
            
            <button onclick="runMajal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl transition-all shadow-lg shadow-blue-900/20 uppercase tracking-widest">
                تشغيل المحرك 🚀
            </button>

            <div id="output" class="mt-8 min-h-[100px]">
                <div class="text-gray-600 text-center text-sm">بانتظار الأوامر...</div>
            </div>
        </div>
    </div>

    <div id="copyModal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
        <div class="bg-[#0a0a0a] border border-white/10 w-full max-w-2xl rounded-[3rem] p-8 shadow-2xl">
            <h3 class="text-xl font-bold mb-6 text-center">تم توليد الكود بنجاح ✨</h3>
            <div id="modalText" class="hidden"></div>
            <pre id="displayArea" class="max-h-80 overflow-y-auto mb-8 text-blue-400"></pre>
            
            <div class="flex gap-4">
                <button id="copyBtn" onclick="copyAction()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-blue-900/40 transition-all active:scale-95">
                    نسخ الكود 📋
                </button>
                <button onclick="closeModal()" class="px-8 bg-white/5 text-gray-400 rounded-2xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // 1. دالة تشغيل المحرك
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            
            if(!code.trim()) return alert("اكتب كود أول يا وسام!");

            outputDiv.innerHTML = '<div class="text-blue-500 font-bold text-center animate-pulse">🔄 جاري معالجة "الجنون" البرمجي...</div>';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                outputDiv.innerHTML = `
                    <div onclick="openModal(\`${encodeURIComponent(data.result)}\`)" class="cursor-pointer group">
                        <pre class="group-hover:border-blue-500/30 transition-all">${data.result}</pre>
                        <p class="text-[10px] text-blue-500 mt-4 text-center font-black tracking-widest uppercase">اضغط هنا لنسخ الكود المولد 🖱️</p>
                    </div>`;
            } catch (e) { 
                outputDiv.innerHTML = '<div class="text-red-500 text-center font-bold">❌ فشل الاتصال بالمحرك</div>'; 
            }
        }

        // 2. دالة فتح النافذة وعرض الكود
        function openModal(encodedCode) {
            const decodedCode = decodeURIComponent(encodedCode);
            document.getElementById('modalText').innerText = decodedCode;
            document.getElementById('displayArea').innerText = decodedCode;
            document.getElementById('copyModal').classList.remove('hidden');
            document.getElementById('copyBtn').innerText = "نسخ الكود 📋";
            document.getElementById('copyBtn').style.backgroundColor = "#2563eb";
        }

        function closeModal() {
            document.getElementById('copyModal').classList.add('hidden');
        }

        // 3. 🔥 دالة النسخ النهائية (قوية جداً للجوال والكمبيوتر)
        async function copyAction() {
            const textToCopy = document.getElementById('modalText').innerText;
            const btn = document.getElementById('copyBtn');

            try {
                // الطريقة الأساسية (Clipboard API)
                await navigator.clipboard.writeText(textToCopy);
                btn.innerText = "تم النسخ بنجاح! ✅";
                btn.style.backgroundColor = "#10b981";
            } catch (err) {
                // الطريقة الاحتياطية (للمتصفحات المقفولة)
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed"; // تجنب التمرير
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    btn.innerText = "تم النسخ بنجاح! ✅";
                    btn.style.backgroundColor = "#10b981";
                } catch (err) {
                    btn.innerText = "فشل النسخ ❌";
                }
                document.body.removeChild(textArea);
            }

            // إغلاق النافذة تلقائياً بعد ثانية ونصف من النجاح
            setTimeout(() => {
                closeModal();
            }, 1500);
        }
    </script>
</body>
</html>
