<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'Fira Code', monospace; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 16px; width: 100%; height: 100%; padding: 20px; }
        #live-canvas { background: #ffffff; color: #000; border-radius: 20px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; }
        .shortcut-btn { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 8px 15px; border-radius: 12px; font-size: 11px; font-weight: bold; transition: all 0.2s; }
        .shortcut-btn:hover { background: #2563eb; color: white; transform: translateY(-2px); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="{ 
    menuOpen: false, 
    mode: 'easy', 
    lang: 'ar',
    addShortcut(type) {
        const editor = document.getElementById('majal-editor');
        const templates = {
            btn: '\n<button style=\'background:#2563eb; color:white; padding:10px 20px; border-radius:10px; border:none;\'>زر جديد</button>',
            text: '\n<h1 style=\'color:#1e293b;\'>عنوان جديد هنا</h1>',
            card: '\n<div style=\'padding:20px; border:1px solid #ddd; border-radius:15px; shadow:auto;\'>\n  <h3>كرت منتج</h3>\n  <p>وصف بسيط...</p>\n</div>'
        };
        editor.value += templates[type];
        MajalCore.process(); // تحديث المعاينة فوراً
    }
}" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <header class="h-[65px] flex items-center justify-between px-8 bg-black/50 border-b border-white/5 z-50">
        <div class="flex items-center gap-6">
            <button @click="menuOpen = true" class="text-2xl text-blue-500">•••</button>
            <h1 class="text-2xl font-black italic tracking-tighter text-blue-500">MAJAL <span class="text-white font-light text-sm">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-5 py-1.5 rounded-lg text-[10px] font-bold transition-all">سهل</button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-5 py-1.5 rounded-lg text-[10px] font-bold transition-all">معقد</button>
        </div>
    </header>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 bottom-0 w-[300px] bg-[#050505] p-8 flex flex-col z-[100] transition-transform duration-300" 
         :class="lang === 'ar' ? 'right-0 border-l border-white/10' : 'left-0 border-r border-white/10'"
         x-cloak :style="menuOpen ? 'transform: translateX(0)' : (lang === 'ar' ? 'transform: translateX(100%)' : 'transform: translateX(-100%)')">
        
        <div class="mb-10">
            <div class="w-14 h-14 rounded-2xl bg-blue-600 mb-4 flex items-center justify-center font-black text-2xl">M</div>
            <h3 class="font-black text-xl">الملف الشخصي</h3>
        </div>

        <nav class="flex-1 space-y-4">
            <button class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition font-bold">الملف الشخصي</button>
            <button class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition font-bold">من نحن</button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right p-3 rounded-xl hover:bg-white/5 border border-white/10 font-bold flex justify-between items-center">
                <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span> 🌐
            </button>
        </nav>
        
        <div class="mt-auto text-center border-t border-white/5 pt-6">
            <p class="text-[10px] font-black text-blue-500 tracking-widest uppercase">صُنع بالسعودية 🇸🇦</p>
        </div>
    </div>

    <main class="flex h-[calc(100vh-65px)] p-4 gap-4">
        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div x-show="mode === 'easy'" x-transition class="px-6 py-3 bg-blue-500/5 border-b border-blue-500/10 flex gap-3 overflow-x-auto items-center">
                <span class="text-[9px] font-black text-blue-400 uppercase ml-2">اختصارات:</span>
                <button @click="addShortcut('btn')" class="shortcut-btn">+ إضافة زر</button>
                <button @click="addShortcut('text')" class="shortcut-btn">+ إضافة عنوان</button>
                <button @click="addShortcut('card')" class="shortcut-btn">+ إضافة كرت</button>
            </div>

            <div class="px-6 py-2 bg-white/5 flex justify-between items-center border-b border-white/5">
                <span class="text-[10px] font-black text-blue-500 uppercase" x-text="mode === 'easy' ? 'BEGINNER MODE' : 'PROFESSIONAL MODE'"></span>
            </div>
            
            <textarea id="majal-editor" oninput="MajalCore.process()" placeholder="// اكتب كودك هنا..."></textarea>
        </div>

        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div class="px-6 py-3 border-b border-white/5 bg-white/5 flex justify-between items-center text-[10px] font-black text-gray-500 uppercase">
                <span>المعاينة الحية</span>
            </div>
            <div class="flex-1 p-4 overflow-auto">
                <div id="live-canvas"></div>
            </div>
        </div>
    </main>

    <script>
        const MajalCore = {
            registry: new Map(),
            process: function() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = ''; return; }
                this.registry.clear();
                let htmlOutput = "";
                const lines = code.split('\n');
                lines.forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const parts = clean.replace("عرف", "").split("=");
                        if (parts[1]) this.registry.set(parts[0].trim(), parts[1].trim().replace(/['"]+/g, ''));
                    } else { htmlOutput += line + "\n"; }
                });
                this.registry.forEach((v, k) => {
                    htmlOutput = htmlOutput.replace(new RegExp(`{${k}}`, 'g'), v);
                });
                canvas.innerHTML = htmlOutput;
            }
        };
    </script>
</body>
</html>
