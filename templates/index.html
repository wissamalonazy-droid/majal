<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO 2.2.3 | OFFICIAL INTERFACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top right, #0a192f, #020617); 
            color: #f8fafc; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        .neon-glow { text-shadow: 0 0 15px rgba(59, 130, 246, 0.7); }
        
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pro-card { 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(59, 130, 246, 0.3); 
            border-radius: 28px;
            flex: 1;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .status-bar {
            background: rgba(59, 130, 246, 0.05);
            border-top: 1px solid rgba(59, 130, 246, 0.1);
            padding: 10px 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 10px;
            color: #60a5fa;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
        }

        #codeEditor {
            background: transparent;
            color: #60a5fa;
            font-family: 'Consolas', monospace;
            width: 100%;
            height: calc(100% - 40px);
            padding: 35px;
            outline: none;
            border: none;
            font-size: 20px;
            line-height: 1.6;
            resize: none;
        }

        .btn-grad {
            background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);
            padding: 18px 40px;
            border-radius: 20px;
            font-weight: 900;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn-grad:hover { transform: translateY(-3px); box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.7); }
        .btn-grad:active { transform: scale(0.97); }

        #previewModal, #copyModal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            flex-direction: column;
        }
        #previewModal { background: #fff; }
        #copyModal { background: rgba(2, 6, 23, 0.98); backdrop-filter: blur(30px); }

        .modal-header {
            background: #050505;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        iframe { width: 100%; flex: 1; border: none; }
    </style>
</head>
<body>

    <header class="header">
        <div class="flex items-center gap-3">
            <div class="flex gap-1.5 ml-4">
                <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
            </div>
            <h1 class="text-3xl font-black text-blue-500 tracking-tighter neon-glow italic uppercase">MAJAL <span class="text-white">PRO</span></h1>
        </div>
        <div class="text-[10px] text-gray-500 font-mono tracking-widest opacity-50 uppercase hidden md:block">Next-Gen Programming Interface</div>
    </header>

    <main class="main-content">
        <div class="pro-card">
            <textarea id="codeEditor" placeholder="// أدخل أوامر مَجال البرمجية هنا"></textarea>
            <div class="status-bar">
                <span>المحرك مستعد للبناء ✅</span>
            </div>
        </div>

        <button onclick="runMajal()" class="btn-grad text-white text-xl flex items-center justify-center gap-4">
            <span>تشغيل المحرك</span>
            <span class="text-2xl">⚡</span>
        </button>
    </main>

    <div id="previewModal">
        <div class="modal-header">
            <span class="text-blue-500 font-black italic tracking-widest neon-glow uppercase">Live Architecture View</span>
            <div class="flex gap-4 items-center">
                <button onclick="showCode()" class="bg-white/5 px-6 py-2 rounded-xl text-xs font-bold text-gray-400 hover:bg-white/10 transition-all border border-white/5">استعراض الكود 📄</button>
                <button onclick="closePreview()" class="text-white text-4xl font-light hover:text-red-500 transition-colors">&times;</button>
            </div>
        </div>
        <iframe id="livePreview"></iframe>
    </div>

    <div id="copyModal">
        <div class="modal-header">
            <h2 class="text-2xl font-black text-blue-500 italic neon-glow uppercase">Generated Source</h2>
            <button onclick="closeCode()" class="text-white text-4xl">&times;</button>
        </div>
        <pre id="modalText" class="flex-1 bg-gray-900/30 p-10 m-8 rounded-[2.5rem] overflow-auto text-blue-300 font-mono text-base border border-white/5 shadow-inner"></pre>
        <div class="pb-12 flex justify-center">
            <button id="copyBtn" onclick="copyAction()" class="btn-grad px-24 py-5 text-white font-black text-xl shadow-2xl">نسخ الكود الكامل 📋</button>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            if(!code.trim()) return;

            const btn = document.querySelector('.btn-grad');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>جاري البناء...</span><span class="animate-spin text-2xl">🌀</span>';

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                const htmlCode = extractHTML(data.result);

                if (htmlCode) {
                    window.lastGeneratedCode = htmlCode;
                    const iframe = document.getElementById('livePreview');
                    const doc = iframe.contentWindow.document;
                    doc.open(); doc.write(htmlCode); doc.close();
                    document.getElementById('previewModal').style.display = 'flex';
                }
            } catch (e) { alert("خطأ في الاتصال"); }
            btn.innerHTML = originalText;
        }

        function extractHTML(text) {
            const start = text.indexOf('<!DOCTYPE html>');
            const end = text.lastIndexOf('</html>') + 7;
            if (start !== -1 && end !== -1) return text.substring(start, end);
            return null;
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }
        function showCode() {
            document.getElementById('modalText').innerText = window.lastGeneratedCode;
            document.getElementById('copyModal').style.display = 'flex';
        }
        function closeCode() { document.getElementById('copyModal').style.display = 'none'; }

        async function copyAction() {
            const text = document.getElementById('modalText').innerText;
            await navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "تم النسخ! ✅";
            btn.style.filter = "hue-rotate(90deg)";
            setTimeout(() => { 
                btn.innerText = "نسخ الكود الكامل 📋"; btn.style.filter = "none";
            }, 2000);
        }
    </script>
</body>
</html>
