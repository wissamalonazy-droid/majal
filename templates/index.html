<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL 2.0.8 | Next-Gen Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: #e2e8f0; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }
        /* تأثير الزجاج الفخم */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* محرر الكود */
        #codeEditor {
            background: #080808;
            color: #60a5fa;
            font-family: 'Consolas', monospace;
            resize: none;
            border: 1px solid #1e293b;
            line-height: 1.6;
        }
        /* منطقة المخرجات */
        #output pre {
            background: #000;
            padding: 20px;
            border-radius: 20px;
            color: #94a3b8;
            font-size: 13px;
            border: 1px solid #111;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .animate-glow {
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px #2563eb44; }
            to { box-shadow: 0 0 25px #2563eb88; }
        }
    </style>
</head>
<body class="p-4 md:p-12 min-h-screen">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-black text-white mb-3 tracking-tighter uppercase">MAJAL <span class="text-blue-600">2.0.8</span></h1>
            <p class="text-gray-500 text-xs font-light tracking-[0.3em] uppercase">Next-Gen Programming Interface</p>
        </header>

        <div class="glass-panel p-6 md:p-8 rounded-[3rem]">
            <textarea id="codeEditor" class="w-full h-80 p-8 rounded-[2rem] mb-6 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all shadow-inner" placeholder="اكتب رؤيتك البرمجية هنا يا وسام..."></textarea>
            
            <button onclick="runMajal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-6 rounded-[1.5rem] transition-all active:scale-95 animate-glow flex items-center justify-center gap-3 uppercase tracking-widest text-lg">
                تشغيل المحرك ⚡
            </button>

            <div id="output" class="mt-10">
                <div class="text-gray-700 text-center text-sm font-bold border-t border-white/5 pt-8 italic">بانتظار إشارة البدء...</div>
            </div>
        </div>
    </div>

    <div id="copyModal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-6">
        <div class="bg-[#080808] border border-white/10 w-full max-w-2xl rounded-[3rem] p-10 shadow-2xl">
            <h3 class="text-2xl font-black mb-8 text-center text-white italic">تم البناء بنجاح ✨</h3>
            <div id="modalText" class="hidden"></div> <pre id="displayArea" class="max-h-80 overflow-y-auto mb-10 text-blue-400 font-mono text-xs p-6 bg-black rounded-3xl border border-white/5"></pre>
            
            <div class="flex gap-4">
                <button id="copyBtn" onclick="copyAction()" class="flex-1 bg-blue-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-blue-900/40 transition-all active:scale-90">
                    نسخ الكود 📋
                </button>
                <button onclick="closeModal()" class="px-10 bg-white/5 text-gray-500 rounded-2xl font-bold hover:text-white transition-colors">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        // 1. تشغيل المحرك والربط مع السيرفر
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            
            if(!code.trim()) return;

            outputDiv.innerHTML = '<div class="text-blue-600 font-black text-center animate-pulse py-4">🔄 جاري هندسة "مَجال"...</div>';
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                outputDiv.innerHTML = `
                    <div onclick="openModal(\`${encodeURIComponent(data.result)}\`)" class="cursor-pointer group transition-all">
                        <pre class="group-hover:border-blue-600/40 transition-all border border-transparent">${data.result}</pre>
                        <p class="text-[10px] text-blue-600 mt-5 text-center font-black tracking-[0.5em] uppercase opacity-50 group-hover:opacity-100 italic">انقر هنا لنسخ المخرج 🖱️</p>
                    </div>`;
            } catch (e) { 
                outputDiv.innerHTML = '<div class="text-red-600 text-center font-bold">❌ خطأ في السيرفر</div>'; 
            }
        }

        // 2. التحكم في النافذة المنبثقة
        function openModal(encodedCode) {
            const decodedCode = decodeURIComponent(encodedCode);
            document.getElementById('modalText').innerText = decodedCode;
            document.getElementById('displayArea').innerText = decodedCode;
            document.getElementById('copyModal').classList.remove('hidden');
            const btn = document.getElementById('copyBtn');
            btn.innerText = "نسخ الكود 📋";
            btn.style.backgroundColor = "#2563eb";
        }

        function closeModal() {
            document.getElementById('copyModal').classList.add('hidden');
        }

        // 3. 🔥 دالة النسخ العبقرية (تعمل على كل الأجهزة)
        async function copyAction() {
            const textToCopy = document.getElementById('modalText').innerText;
            const btn = document.getElementById('copyBtn');

            try {
                // الطريقة الحديثة
                await navigator.clipboard.writeText(textToCopy);
                btn.innerText = "تم النسخ بنجاح! ✅";
                btn.style.backgroundColor = "#10b981";
            } catch (err) {
                // الطريقة الاحتياطية للجوالات القديمة
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                btn.innerText = "تم النسخ بنجاح! ✅";
                btn.style.backgroundColor = "#10b981";
            }

            setTimeout(() => { closeModal(); }, 1200);
        }
    </script>
</body>
</html>
