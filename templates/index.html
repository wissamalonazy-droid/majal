<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL ENGINE | Global Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --bg: #020617; }
        body { 
            background: radial-gradient(circle at top right, #0f172a, var(--bg)); 
            color: #f8fafc; font-family: 'Tajawal', sans-serif;
            margin: 0; height: 100vh; transition: all 0.3s ease;
        }
        .en-mode { font-family: 'Inter', sans-serif; direction: ltr; }
        .glass { background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 24px; }
        #codeEditor { font-family: 'Fira Code', monospace; }
    </style>
</head>
<body x-data="{ lang: 'ar', dir: 'rtl' }" :class="lang === 'en' ? 'en-mode' : ''" :dir="dir">

    <header class="h-[70px] flex items-center justify-between px-8 bg-black/30 border-b border-white/5">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black text-blue-500 italic uppercase">MAJAL <span class="text-white">PRO</span></h1>
        </div>
        
        <button @click="lang = (lang === 'ar' ? 'en' : 'ar'); dir = (lang === 'ar' ? 'rtl' : 'ltr')" 
                class="bg-white/5 px-4 py-2 rounded-xl text-xs font-bold border border-white/10 hover:bg-blue-500/20 transition-all">
            <span x-text="lang === 'ar' ? 'Switch to English 🌐' : 'التحويل للعربية 🌐'"></span>
        </button>
    </header>

    <main class="p-6 h-[calc(100vh-70px)] flex flex-col gap-4">
        <div class="glass flex-1 flex flex-col overflow-hidden">
            <div class="p-4 border-b border-white/5 flex justify-between items-center">
                <span class="text-[10px] font-mono uppercase tracking-widest text-blue-400" 
                      x-text="lang === 'ar' ? 'محرر مَجال الذكي' : 'MAJAL SMART EDITOR'"></span>
                <div class="flex gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500/50"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-500/50"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500/50"></div>
                </div>
            </div>

            <textarea id="codeEditor" 
                      :placeholder="lang === 'ar' ? '// أدخل أوامر مَجال البرمجية هنا...' : '// Enter Majal commands here...'"
                      class="flex-1 bg-transparent p-6 outline-none text-blue-300 text-lg resize-none"></textarea>
            
            <div id="statusBar" class="p-4 bg-black/20 text-xs border-t border-white/5">
                <span x-text="lang === 'ar' ? 'المحرك في وضع الاستعداد' : 'Engine Ready'"></span>
            </div>
        </div>

        <button onclick="runMajal()" 
                class="bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl font-black text-xl shadow-xl shadow-blue-900/20 transition-all flex items-center justify-center gap-3">
            <span x-text="lang === 'ar' ? 'تشغيل المحرك' : 'RUN ENGINE'"></span>
            <span>⚡</span>
        </button>
    </main>

    <div id="previewModal" class="fixed inset-0 z-[100] bg-black hidden flex-col">
        <div class="p-4 bg-zinc-950 flex justify-between items-center">
            <span class="text-blue-500 font-bold text-xs uppercase tracking-widest">Live Preview</span>
            <button onclick="document.getElementById('previewModal').style.display='none'" class="text-white text-3xl">&times;</button>
        </div>
        <iframe id="livePreview" class="flex-1 w-full bg-white"></iframe>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            if(!code.trim()) return;

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                if (data.result.includes("<!DOCTYPE html>")) {
                    const iframe = document.getElementById('livePreview');
                    const doc = iframe.contentWindow.document;
                    doc.open(); doc.write(extractHTML(data.result)); doc.close();
                    document.getElementById('previewModal').style.display = 'flex';
                } else {
                    document.getElementById('statusBar').innerHTML = `<span class="text-red-400">${data.result}</span>`;
                }
            } catch (e) { alert("Error connecting to engine"); }
        }

        function extractHTML(text) {
            const start = text.indexOf('<!DOCTYPE html>');
            const end = text.lastIndexOf('</html>') + 7;
            return (start !== -1 && end !== -1) ? text.substring(start, end) : text;
        }
    </script>
</body>
</html>
