<script>
    async function runMajal() {
        const code = document.getElementById('codeEditor').value;
        const outputDiv = document.getElementById('output');
        
        outputDiv.innerHTML = '<div class="text-blue-400 animate-pulse">🔍 جاري المعالجة والتحليل...</div>';

        try {
            const response = await fetch('/run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code: code})
            });
            const data = await response.json();
            
            const lines = data.result.split('\n');
            let formattedOutput = '';

            lines.forEach(line => {
                if (line.includes('🚨') || line.includes('❌')) {
                    formattedOutput += `<div style="color: #FF4B4B; background: rgba(255,0,0,0.1); padding: 5px; border-right: 3px solid red; margin-bottom: 5px;">${line}</div>`;
                } else if (line.includes('🏗️')) {
                    formattedOutput += `<div style="color: #FFD700; background: rgba(255,215,0,0.1); padding: 5px; border-right: 3px solid #FFD700; margin-bottom: 5px;">${line}</div>`;
                } else if (line.includes('🔍')) {
                    formattedOutput += `<div style="color: #00D1FF; background: rgba(0,209,255,0.1); padding: 5px; border-right: 3px solid #00D1FF; margin-bottom: 5px;">${line}</div>`;
                } else {
                    formattedOutput += `<div style="color: #00FF41; padding: 2px;">${line}</div>`;
                }
            });

            outputDiv.innerHTML = formattedOutput;
        } catch (err) {
            outputDiv.innerHTML = `<div style="color: red;">❌ فشل الاتصال بالمحرك</div>`;
        }
    }
</script>
