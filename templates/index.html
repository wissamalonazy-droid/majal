<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | Wide Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #050505; 
            color: #f8fafc; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: #0a0a0a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .editor-container {
            flex: 1;
            position: relative;
        }
        #codeEditor {
            background: transparent;
            color: #60a5fa;
            font-family: 'Consolas', monospace;
            width: 100%;
            height: 100%;
            padding: 40px;
            outline: none;
            border: none;
            font-size: 20px; /* خط كبير وواضح */
            line-height: 1.6;
        }
        /* نافذة المعاينة العائمة */
        #previewModal {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 100;
            display: none;
            flex-direction: column;
        }
        .preview-header {
            background: #111;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        iframe { width: 100%; flex: 1; border: none; }
        .magic-btn {
            background: #2563eb;
            padding: 12px 35px;
            border-radius: 15px;
            font-weight: 900;
            transition: 0.3s;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
        }
        .magic-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="text-2xl font-black text-blue-500 tracking-tighter uppercase italic">MAJAL <span class="text-white">PRO</span></h1>
        <div class="flex gap-4">
            <button onclick="runMajal()" class="magic-btn">بناء ومعاينة ⚡</button>
        </div>
    </header>

    <div class="editor-container">
        <textarea id="codeEditor" placeholder="أدخل أوامرك هنا..."></textarea>
    </div>

    <div id="previewModal">
        <div class="preview-header">
            <span class="text-blue-400 font-black text-sm uppercase tracking-widest italic">Live Preview</span>
            <div class="flex gap-4">
                <button onclick="showCode()" class="bg-white/10 px-4 py-2 rounded-lg text-xs font-bold">عرض الكود 📄</button>
                <button onclick="closePreview()" class="text-white text-3xl font-light">&times;</button>
            </div>
        </div>
        <iframe id="livePreview"></iframe>
    </div>

    <div id="copyModal" class="fixed inset-0 bg-black/98 hidden z-[200] flex flex-col p-10 backdrop-blur-xl">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <h2 class="text-xl font-bold text-blue-500 uppercase italic">Source Code</h2>
            <button onclick="closeCode()" class="text-white text-3xl">&times;</button>
        </div>
        <pre id="modalText" class="flex-1 bg-gray-900/50 p-8 rounded-3xl overflow-auto text-blue-400 font-mono text-sm border border-white/5"></pre>
        <div class="mt-8 flex justify-center">
            <button id="copyBtn" onclick="copyAction()" class="bg-blue-600 px-16 py-5 rounded-2xl font-black text-xl shadow-2xl shadow-blue-900/40">نسخ الكود الكامل 📋</button>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            if(!code.trim()) return;

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                const htmlCode = extractHTML(data.result);

                if (htmlCode) {
                    window.lastGeneratedCode = htmlCode;
                    const iframe = document.getElementById('livePreview');
                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(htmlCode);
                    doc.close();
                    
                    // إظهار المعاينة بملء الشاشة
                    document.getElementById('previewModal').style.display = 'flex';
                }
            } catch (e) { alert("خطأ في الاتصال بالسيرفر"); }
        }

        function extractHTML(text) {
            const start = text.indexOf('<!DOCTYPE html>');
            const end = text.lastIndexOf('</html>') + 7;
            if (start !== -1 && end !== -1) return text.substring(start, end);
            return null;
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }
        
        function showCode() {
            document.getElementById('modalText').innerText = window.lastGeneratedCode;
            document.getElementById('copyModal').classList.remove('hidden');
        }

        function closeCode() { document.getElementById('copyModal').classList.add('hidden'); }

        async function copyAction() {
            const text = document.getElementById('modalText').innerText;
            await navigator.clipboard.writeText(text);
            const btn = document.getElementById('copyBtn');
            btn.innerText = "تم النسخ بنجاح! ✅";
            btn.style.backgroundColor = "#10b981";
            setTimeout(() => { 
                btn.innerText = "نسخ الكود الكامل 📋"; 
                btn.style.backgroundColor = "#2563eb";
            }, 2000);
        }
    </script>
</body>
</html>
