<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مَجال ULTRA | المحرك الشامل v27</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root { --bg: #080a0f; --card: #11141d; --border: #1e2533; --accent: #f5a623; --text: #f1f5f9; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans Arabic', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header { height: 70px; background: rgba(17, 20, 29, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; flex-shrink: 0; }
    .logo { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -1px; }
    .btn-build { background: var(--accent); color: #000; border: none; padding: 10px 30px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .btn-build:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(245, 166, 35, 0.3); }

    /* Layout */
    .workspace { display: grid; grid-template-rows: 1fr 1fr; flex: 1; overflow: hidden; }
    .preview-area { background: #000; display: flex; justify-content: center; align-items: center; padding: 20px; position: relative; }
    #viewport { width: 100%; max-width: 1200px; height: 100%; background: #fff; border-radius: 20px; border: none; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }

    .controls-area { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
    .pane { background: var(--bg); display: flex; flex-direction: column; }
    .pane-hdr { padding: 12px 25px; font-size: 11px; font-weight: 700; background: var(--card); color: #64748b; border-bottom: 1px solid var(--border); text-transform: uppercase; }
    
    #prompt-in { flex: 1; background: transparent; color: var(--accent); border: none; outline: none; padding: 25px; font-size: 17px; font-weight: 600; resize: none; line-height: 1.6; }
    #code-out { flex: 1; background: #05060a; color: #a5d6ff; border: none; outline: none; padding: 25px; font-family: 'JetBrains Mono', monospace; font-size: 11px; direction: ltr; text-align: left; }
</style>
</head>
<body>

<header>
    <div class="logo">MAJAL <span style="font-weight: 300; font-size: 12px; color: #fff; opacity: 0.5;">SITE BUILDER v27</span></div>
    <button class="btn-build" onclick="generateAnySite()">⚡ بناء النظام الشامل</button>
</header>

<div class="workspace">
    <div class="preview-area"><iframe id="viewport"></iframe></div>
    <div class="controls-area">
        <div class="pane">
            <div class="pane-hdr">وصف النظام أو الموقع المطلوب</div>
            <textarea id="prompt-in">موقع شركة مقاولات فخم، ألوان أسود ورمادي، صور مشاريع، قسم تواصل</textarea>
        </div>
        <div class="pane">
            <div class="pane-hdr">الكود المصدري الكامل (Ready to Deploy) <span style="color:var(--accent); float:left; cursor:pointer;" onclick="copyCode()">[نسخ]</span></div>
            <textarea id="code-out" readonly></textarea>
        </div>
    </div>
</div>

<script>
function generateAnySite() {
    const q = document.getElementById('prompt-in').value;
    const siteName = q.match(/(?:متجر|موقع|شركة)\s+([\u0621-\u064A0-9]+)/)?.[1] || "MAJAL PROJECT";
    
    // --- محرك تحليل الأنماط (Universal Pattern Engine) ---
    const isStore = q.includes('متجر') || q.includes('بيع');
    const isCompany = q.includes('شركة') || q.includes('موقع');
    
    // استخراج الألوان
    const colors = {'أسود':'#0a0a0a','أبيض':'#ffffff','ذهبي':'#c6a355','أزرق':'#1e40af','أحمر':'#e11d48','رمادي':'#374151'};
    let bg = '#ffffff', accent = '#1e40af', text = '#0f172a';
    
    Object.keys(colors).forEach(c => {
        if(q.includes(c)) {
            if(c === 'أسود') { bg = '#0a0a0a'; text = '#f1f5f9'; }
            else if(c === 'أبيض') { bg = '#ffffff'; text = '#0f172a'; }
            else accent = colors[c];
        }
    });

    // اختيار هيكل الصفحة (Layout Logic)
    let bodyContent = '';
    if(isStore) {
        bodyContent = `
            <section class="hero"><h1>أهلاً بك في ${siteName}</h1><p>تسيّد عالم التجارة الإلكترونية</p></section>
            <div class="grid">
                ${[1,2,3].map(i => `<div class="card"><h3>منتج ذكي ${i}</h3><p class="price">250 ريال</p><button>أضف للسلة</button></div>`).join('')}
            </div>`;
    } else {
        bodyContent = `
            <section class="hero"><h1>${siteName}</h1><p>نحن نبني المستقبل بدقة واحترافية</p></section>
            <div class="section-box">
                <h2>عن الشركة</h2>
                <p>نقدم حلولاً متكاملة تهدف إلى التميز والريادة في السوق المحلي والعالمي.</p>
            </div>
            <div class="grid">
                <div class="card"><h3>خدماتنا</h3><p>تفاصيل الخدمة التقنية</p></div>
                <div class="card"><h3>مشاريعنا</h3><p>استعرض سابقة أعمالنا</p></div>
                <div class="card"><h3>اتصل بنا</h3><p>خدمة عملاء 24/7</p></div>
            </div>`;
    }

    const finalHTML = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: ${accent}; --bg: ${bg}; --text: ${text}; }
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { padding: 20px 5%; border-bottom: 1px solid rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .hero { padding: 100px 5%; text-align: center; background: radial-gradient(circle at center, var(--accent) 0%, transparent 80%); opacity: 0.9; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px 5%; max-width: 1200px; margin: 0 auto; }
        .card { background: ${bg === '#0a0a0a' ? '#141414' : '#f9f9f9'}; padding: 35px; border-radius: 20px; border: 1px solid var(--accent)33; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .section-box { padding: 60px 5%; max-width: 800px; margin: 0 auto; text-align: center; }
        button { background: var(--accent); color: #fff; border: none; padding: 15px 30px; border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; }
        .price { font-size: 24px; font-weight: 700; color: var(--accent); margin: 15px 0; }
    </style>
</head>
<body>
    <header><div style="font-weight: 700; color: var(--accent);">${siteName}</div></header>
    ${bodyContent}
</body>
</html>`;

    document.getElementById('code-out').value = finalHTML;
    const v = document.getElementById('viewport');
    v.contentWindow.document.open();
    v.contentWindow.document.write(finalHTML);
    v.contentWindow.document.close();
}

function copyCode() {
    const c = document.getElementById('code-out');
    c.select();
    document.execCommand('copy');
    alert("تم نسخ الكود السيادي!");
}
</script>
</body>
</html>
