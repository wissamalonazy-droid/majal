<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL | المحيط البرمجي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0b0b; font-family: sans-serif; color: white; }
        .glass { background: #111; border: 1px solid #222; border-radius: 15px; }
        .code-area { font-family: monospace; color: #3b82f6; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-blue-500 text-center">مَجال PRO 🚀</h1>
        
        <div class="glass p-4">
            <textarea id="codeEditor" class="w-full h-64 bg-transparent outline-none code-area text-lg" placeholder="اكتب كودك هنا..."></textarea>
        </div>

        <div id="output" class="glass p-4 h-48 overflow-auto text-sm border-r-4 border-blue-600">
            <span class="text-gray-600">// جاهز للعمل...</span>
        </div>

        <button onclick="runMajal()" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500 transition-all">تشغيل المحرك</button>
    </div>

    <div id="copyModal" class="fixed inset-0 bg-black/90 hidden flex flex-col p-10 z-50">
        <div class="flex justify-between mb-4">
            <h2 class="text-xl">الكود المولد:</h2>
            <button onclick="closeModal()" class="text-red-500 text-2xl">إغلاق ×</button>
        </div>
        <pre id="fullCode" class="bg-gray-900 p-6 rounded-lg overflow-auto flex-1 text-green-400 text-sm whitespace-pre-wrap"></pre>
        <button onclick="copyToClipboard()" id="copyBtn" class="mt-4 bg-green-600 py-3 rounded-lg font-bold">نسخ الكود بالكامل 📋</button>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            const outputDiv = document.getElementById('output');
            
            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                // عرض النتيجة وجعلها قابلة للضغط للنسخ
                outputDiv.innerHTML = `<div onclick="openModal('${encodeURIComponent(data.result)}')" class="cursor-pointer hover:text-blue-400">
                    ${data.result.replace(/\n/g, '<br>')}
                    <br><span class="text-blue-500 text-xs">[ اضغط هنا لعرض ونسخ الكود الكامل ]</span>
                </div>`;
            } catch (e) { outputDiv.innerText = "خطأ في الاتصال"; }
        }

        function openModal(code) {
            document.getElementById('fullCode').innerText = decodeURIComponent(code);
            document.getElementById('copyModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('copyModal').classList.add('hidden'); }

        function copyToClipboard() {
            const text = document.getElementById('fullCode').innerText;
            navigator.clipboard.writeText(text);
            document.getElementById('copyBtn').innerText = "تم النسخ! ✅";
            setTimeout(() => { document.getElementById('copyBtn').innerText = "نسخ الكود بالكامل 📋"; }, 2000);
        }
    </script>
</body>
</html>
