<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL PRO | COMMAND ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'monospace'; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 20px; width: 100%; height: 100%; padding: 40px; }
        #live-canvas { background: #fff; border-radius: 30px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()">

    <header class="h-[65px] flex items-center justify-between px-10 bg-black/40 border-b border-white/5 z-50 shadow-2xl">
        <h1 class="text-2xl font-black italic text-blue-500 tracking-tighter">MAJAL <span class="text-white font-light text-sm italic">COMMAND CORE</span></h1>
        <div class="flex gap-4 items-center">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">وضع البرو: مفعل</span>
            <div class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>
        </div>
    </header>

    <main class="flex flex-col h-[calc(100vh-65px)] p-6 gap-6">
        <div class="flex-1 glass rounded-[40px] flex flex-col overflow-hidden shadow-2xl border border-blue-500/10">
            <div class="px-8 py-3 bg-white/5 border-b border-white/5 flex justify-between items-center text-[10px] font-black text-blue-400">
                <span>اكتب المواصفات (مثال: متجر بيع اشتراكات ألوان أبيض أصفر أزرق)</span>
            </div>
            <textarea id="majal-editor" @input="onInput($event)" placeholder="اكتب أمر البناء هنا..."></textarea>
        </div>

        <div class="flex-1 glass rounded-[40px] flex flex-col overflow-hidden">
            <div id="live-canvas"></div>
        </div>
    </main>

    <script>
        function majalApp() {
            return {
                init() { this.generate(); },
                onInput() { this.generate(); },
                generate() {
                    const input = document.getElementById('majal-editor').value;
                    const canvas = document.getElementById('live-canvas');
                    
                    if (!input.includes("متجر")) {
                        canvas.innerHTML = `<div class="flex items-center justify-center h-full text-gray-400 italic">اكتب "متجر" لتبدأ السحر...</div>`;
                        return;
                    }

                    // نظام تحليل الألوان الذكي
                    const colors = {
                        bg: input.includes("أبيض") ? "#ffffff" : (input.includes("أسود") ? "#0f172a" : "#f8fafc"),
                        primary: input.includes("أصفر") ? "#facc15" : (input.includes("أزرق") ? "#2563eb" : "#1e293b"),
                        secondary: input.includes("أزرق") ? "#3b82f6" : "#64748b",
                        text: input.includes("أسود") || input.includes("أزرق") ? "#ffffff" : "#0f172a"
                    };

                    // تحليل نوع النشاط
                    let type = "عام";
                    let items = ["منتج 1", "منتج 2", "منتج 3"];
                    if (input.includes("اشتراكات")) {
                        type = "اشتراكات رقمية ⚡";
                        items = ["يوتيوب بريميوم", "نيتفليكس شهر", "شاهد VIP"];
                    } else if (input.includes("عطور")) {
                        type = "عطور فاخرة 🧴";
                        items = ["سديم 1", "سديم 2", "سديم 3"];
                    }

                    canvas.innerHTML = `
                        <div style="background: ${colors.bg}; color: ${input.includes("أسود") ? '#fff' : '#000'}; min-height: 100%; transition: 0.5s;" dir="rtl" class="p-8">
                            <nav class="flex justify-between items-center mb-10 border-b pb-6" style="border-color: ${colors.primary}44">
                                <h2 class="text-2xl font-black" style="color: ${colors.primary}">مَجال | ${type}</h2>
                                <div class="flex gap-4 font-bold text-sm"><span>الرئيسية</span><span>السلة</span></div>
                            </nav>
                            
                            <div class="rounded-[40px] p-10 mb-10 text-center shadow-2xl" style="background: ${colors.primary}; color: ${colors.text}">
                                <h1 class="text-4xl font-black mb-4 italic">أهلاً بك في متجرك السيادي</h1>
                                <p class="opacity-90 font-medium">أفضل وجهة لـ ${type} بكل سهولة وأمان.</p>
                            </div>

                            <div class="grid grid-cols-3 gap-6">
                                ${items.map(item => `
                                    <div class="bg-white p-6 rounded-[30px] border shadow-sm hover:shadow-xl transition-all" style="border-color: ${colors.primary}22">
                                        <div class="h-32 rounded-2xl mb-4 flex items-center justify-center text-3xl" style="background: ${colors.bg === '#ffffff' ? '#f1f5f9' : '#1e293b'}">📦</div>
                                        <h3 class="font-black text-xl mb-2" style="color: #0f172a">${item}</h3>
                                        <p class="text-gray-400 text-xs font-bold mb-6 italic">منتج أصلي ومضمون 100%</p>
                                        <button class="w-full py-4 rounded-2xl font-black transition text-white" style="background: ${colors.primary}">شراء الآن</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
