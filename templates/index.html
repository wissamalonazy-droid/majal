<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | HORIZONTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'Fira Code', monospace; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 16px; width: 100%; height: 100%; padding: 20px; }
        
        /* شاشة المعاينة السفلية */
        #live-canvas { 
            background: #ffffff; color: #000; border-radius: 20px; 
            width: 100%; height: 100%; overflow: auto; 
            border: 4px solid #1e293b;
        }

        .scroll-custom::-webkit-scrollbar { width: 5px; }
        .scroll-custom::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()" :dir="lang === 'ar' ? 'rtl' : 'ltr'">

    <header class="h-[60px] flex items-center justify-between px-8 bg-black/50 border-b border-white/5 z-50">
        <div class="flex items-center gap-4">
            <button @click="menuOpen = true" class="text-2xl text-blue-500 hover:scale-110 transition">•••</button>
            <h1 class="text-xl font-black italic text-blue-500 tracking-tighter">MAJAL <span class="text-white font-light text-xs">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-5 py-1 rounded-lg text-[10px] font-bold transition-all">سهل</button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white shadow-lg' : 'text-gray-500'" class="px-5 py-1 rounded-lg text-[10px] font-bold transition-all">معقد</button>
        </div>
    </header>

    <main class="flex flex-col h-[calc(100vh-60px)] p-4 gap-4 bg-[#020617]">
        
        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden shadow-xl border border-white/5">
            <div x-show="mode === 'easy'" class="px-6 py-2 bg-blue-600/5 border-b border-blue-500/10 flex gap-3 overflow-x-auto no-scrollbar items-center">
                <button @click="addSection('header')" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold hover:bg-blue-600 hover:text-white transition">+ هيدر</button>
                <button @click="addSection('card')" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold hover:bg-blue-600 hover:text-white transition">+ كرت</button>
            </div>
            <div class="px-6 py-2 bg-white/5 border-b border-white/5 flex justify-between items-center text-[10px] font-black text-blue-500 uppercase tracking-widest">
                <span>المحرر البرمجي</span>
                <div class="flex gap-1.5"><div class="w-2 h-2 rounded-full bg-red-500"></div><div class="w-2 h-2 rounded-full bg-yellow-500"></div><div class="w-2 h-2 rounded-full bg-green-500"></div></div>
            </div>
            <textarea id="majal-editor" @input="onInput($event)" placeholder="// اكتب كودك هنا..."></textarea>
        </div>

        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden shadow-2xl border border-white/5">
            <div class="px-6 py-2 border-b border-white/5 bg-white/5 flex justify-between items-center text-[10px] font-black text-gray-500 uppercase tracking-widest">
                <span>المعاينة الحية (عرض كامل)</span>
                <span class="text-green-500 animate-pulse">● Active Engine</span>
            </div>
            <div class="flex-1 p-4 overflow-hidden">
                <div id="live-canvas"></div>
            </div>
        </div>

    </main>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 bottom-0 w-[280px] bg-[#050505] p-10 flex flex-col z-[100] transition-transform duration-300 shadow-2xl" :class="lang === 'ar' ? 'right-0 border-l border-white/10' : 'left-0 border-r border-white/10'" x-cloak :style="menuOpen ? 'transform: translateX(0)' : (lang === 'ar' ? 'transform: translateX(100%)' : 'transform: translateX(-100%)')">
        <nav class="flex-1 space-y-4 pt-10">
            <button @click="activeModal = 'profile'; menuOpen = false" class="w-full text-right p-4 rounded-xl hover:bg-white/5 transition font-bold flex justify-between items-center">
                <span>الملف الشخصي</span> <span>👤</span>
            </button>
            <button @click="activeModal = 'about'; menuOpen = false" class="w-full text-right p-4 rounded-xl hover:bg-white/5 transition font-bold flex justify-between items-center">
                <span>من نحن</span> <span>ℹ️</span>
            </button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right p-4 rounded-xl border border-white/5 font-bold flex justify-between items-center hover:bg-white/5 transition">
                <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span> 🌐
            </button>
            <button @click="exportProject()" class="w-full text-right p-4 rounded-xl bg-green-600/10 text-green-400 border border-green-500/20 font-black flex justify-between items-center">
                <span>تصدير الموقع</span> <span>📥</span>
            </button>
        </nav>
        <div class="mt-auto text-center border-t border-white/5 pt-6 text-[9px] font-black text-gray-700 uppercase tracking-widest">صُنع بالسعودية 🇸🇦</div>
    </div>

    <div x-show="activeModal" class="fixed inset-0 z-[200] bg-black/90 backdrop-blur-md flex items-center justify-center p-6" x-cloak x-transition>
        <div class="w-full max-w-md glass p-10 rounded-[40px] text-center border border-blue-500/30">
            <h2 class="text-2xl font-black mb-4 text-blue-500" x-text="activeModal === 'profile' ? 'الملف الشخصي' : 'من نحن'"></h2>
            <p class="text-gray-300 text-sm mb-8" x-text="activeModal === 'profile' ? 'أنت المطور المسؤول عن هذا النظام.' : 'مَجال هو محرك برمجي عربي سيادي.'"></p>
            <button @click="activeModal = null" class="bg-blue-600 w-full py-4 rounded-2xl font-black shadow-xl shadow-blue-900/40">إغلاق</button>
        </div>
    </div>

    <script>
        function majalApp() {
            return {
                menuOpen: false, mode: 'pro', lang: 'ar', activeModal: null,
                init() {
                    const saved = localStorage.getItem('majal_autosave');
                    if(saved) {
                        document.getElementById('majal-editor').value = saved;
                        setTimeout(() => MajalCore.process(), 100);
                    }
                },
                onInput(e) {
                    localStorage.setItem('majal_autosave', e.target.value);
                    MajalCore.process();
                },
                addSection(type) {
                    const editor = document.getElementById('majal-editor');
                    const html = type === 'header' ? '\n<header style="background:#1e293b; color:white; padding:20px; text-align:center; border-radius:15px;"><h2>متجري</h2></header>' : '\n<div style="background:#f1f5f9; padding:20px; border-radius:15px; margin-top:10px; text-align:center;">كرت منتج مميز</div>';
                    editor.value += html;
                    MajalCore.process();
                },
                exportProject() {
                    const code = document.getElementById('live-canvas').innerHTML;
                    const blob = new Blob([code], {type: 'text/html'});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'index.html';
                    a.click();
                }
            }
        }
        const MajalCore = {
            registry: new Map(),
            process() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = ''; return; }
                this.registry.clear();
                let out = "";
                code.split('\n').forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const pts = clean.replace("عرف", "").split("=");
                        if (pts[1]) this.registry.set(pts[0].trim(), pts[1].trim().replace(/['"]+/g, ''));
                    } else { out += line + "\n"; }
                });
                this.registry.forEach((v, k) => out = out.replace(new RegExp(`{${k}}`, 'g'), v));
                canvas.innerHTML = out;
            }
        };
    </script>
</body>
</html>
