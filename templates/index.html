<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | Live Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #020617; 
            color: #f8fafc; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 80px);
        }
        .editor-section {
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            background: #050505;
        }
        .preview-section {
            background: #ffffff; /* خلفية المعاينة بيضاء لتبدو كمتصفح حقيقي */
            color: black;
        }
        #codeEditor {
            background: transparent;
            color: #60a5fa;
            font-family: 'Consolas', monospace;
            resize: none;
            width: 100%;
            height: 100%;
            padding: 30px;
            outline: none;
            border: none;
            font-size: 18px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .header {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: #050505;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .magic-btn {
            background: #2563eb;
            padding: 10px 30px;
            border-radius: 12px;
            font-weight: 900;
            transition: 0.3s;
        }
        .magic-btn:hover { background: #1d4ed8; transform: scale(1.05); }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="text-2xl font-black text-blue-500 tracking-tighter uppercase">MAJAL <span class="text-white">PRO</span></h1>
        <button onclick="runMajal()" class="magic-btn">توليد ومعاينة ⚡</button>
    </header>

    <div class="main-grid">
        <div class="editor-section">
            <textarea id="codeEditor" placeholder="أدخل أوامر البرمجة هنا..."></textarea>
        </div>

        <div class="preview-section" id="previewContainer">
            <div id="placeholderText" class="h-full flex items-center justify-center text-gray-400 font-bold italic">
                بانتظار بناء الواجهة...
            </div>
            <iframe id="livePreview" class="hidden"></iframe>
        </div>
    </div>

    <div id="copyModal" class="fixed inset-0 bg-black/95 hidden z-[100] flex flex-col p-10 backdrop-blur-xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-blue-400 uppercase">Generated Source Code</h2>
            <button onclick="closeModal()" class="text-white text-3xl">&times;</button>
        </div>
        <pre id="modalText" class="flex-1 bg-gray-900 p-6 rounded-2xl overflow-auto text-emerald-400 font-mono text-sm"></pre>
        <div class="mt-6 flex justify-center gap-4">
            <button id="copyBtn" onclick="copyAction()" class="bg-blue-600 px-12 py-4 rounded-xl font-black">نسخ الكود 📋</button>
            <button onclick="toggleView()" class="bg-white/10 px-8 py-4 rounded-xl font-bold">رجوع للمعاينة</button>
        </div>
    </div>

    <script>
        async function runMajal() {
            const code = document.getElementById('codeEditor').value;
            if(!code.trim()) return;

            try {
                const response = await fetch('/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code})
                });
                const data = await response.json();
                
                // استخراج كود الـ HTML من مخرجات السيرفر
                const rawResult = data.result;
                const htmlCode = extractHTML(rawResult);

                if (htmlCode) {
                    const iframe = document.getElementById('livePreview');
                    const placeholder = document.getElementById('placeholderText');
                    
                    placeholder.classList.add('hidden');
                    iframe.classList.remove('hidden');
                    
                    // حقن الكود المولد داخل الـ Iframe للعرض المباشر
                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write(htmlCode);
                    doc.close();

                    // تخزين الكود للنسخ لاحقاً
                    window.lastGeneratedCode = htmlCode;
                    
                    // إظهار زر صغير أو خيار للنسخ إذا أراد المستخدم
                    console.log("تم تحديث المعاينة الحية");
                }
            } catch (e) { alert("خطأ في الاتصال"); }
        }

        // دالة لاستخراج كود HTML فقط من رد السيرفر
        function extractHTML(text) {
            const start = text.indexOf('<!DOCTYPE html>');
            const end = text.lastIndexOf('</html>') + 7;
            if (start !== -1 && end !== -1) {
                return text.substring(start, end);
            }
            return null;
        }

        // وظائف النسخ والـ Modal
        function showCode() {
            if(!window.lastGeneratedCode) return alert("ابني الموقع أولاً!");
            document.getElementById('modalText').innerText = window.lastGeneratedCode;
            document.getElementById('copyModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('copyModal').classList.add('hidden'); }

        async function copyAction() {
            const text = document.getElementById('modalText').innerText;
            await navigator.clipboard.writeText(text);
            document.getElementById('copyBtn').innerText = "تم النسخ! ✅";
            setTimeout(() => { document.getElementById('copyBtn').innerText = "نسخ الكود 📋"; }, 2000);
        }
    </script>
</body>
</html>
