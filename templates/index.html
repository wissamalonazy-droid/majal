<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAJAL PRO | NUCLEUS v1.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* منع السكرول في الجسم كامل */
        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden;
            background-color: #020617; color: white; font-family: 'Tajawal', sans-serif;
        }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* منطقة المحرر */
        #majal-editor { 
            font-family: 'Fira Code', 'Consolas', monospace; 
            background: transparent; border: none; outline: none; resize: none;
            color: #93c5fd; font-size: 16px; line-height: 1.6; width: 100%; height: 100%;
            padding: 20px;
        }

        /* منطقة المعاينة - تحسين جذري */
        #live-canvas { 
            background: #ffffff; color: #000; border-radius: 20px;
            width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
            border: 4px solid #1e293b;
        }

        /* تخصيص التمرير للصناديق فقط */
        .scroll-area { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1e293b transparent; }
        .scroll-area::-webkit-scrollbar { width: 4px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body x-data="{ menuOpen: false, mode: 'pro', lang: 'ar' }">

    <header class="h-[65px] flex items-center justify-between px-8 bg-black/50 border-b border-white/5 z-50">
        <div class="flex items-center gap-6">
            <button @click="menuOpen = true" class="text-2xl text-blue-500 hover:scale-110 transition">•••</button>
            <h1 class="text-2xl font-black italic tracking-tighter text-blue-500">MAJAL <span class="text-white font-light text-sm">PRO</span></h1>
        </div>
        
        <div class="bg-white/5 p-1 rounded-xl flex border border-white/10">
            <button @click="mode = 'easy'" :class="mode === 'easy' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-5 py-1.5 rounded-lg text-[10px] font-bold transition-all">سهل</button>
            <button @click="mode = 'pro'" :class="mode === 'pro' ? 'bg-blue-600 text-white' : 'text-gray-500'" class="px-5 py-1.5 rounded-lg text-[10px] font-bold transition-all">معقد</button>
        </div>
    </header>

    <div x-show="menuOpen" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[99]" @click="menuOpen = false" x-cloak x-transition.opacity></div>
    <div x-show="menuOpen" class="fixed top-0 right-0 w-[300px] h-full bg-[#050505] border-l border-white/10 p-8 flex flex-col z-[100]" x-cloak
         x-transition:enter="transition transform duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition transform duration-300" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full">
        <div class="mb-10">
            <div class="w-14 h-14 rounded-2xl bg-blue-600 mb-4 flex items-center justify-center font-black text-2xl shadow-xl shadow-blue-900/40">M</div>
            <h3 class="font-black text-xl">المضياني 🔒</h3>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">صنع بالسعودية 🇸🇦</p>
        </div>
        <nav class="flex-1 space-y-2">
            <button class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition font-bold">الملف الشخصي</button>
            <button class="w-full text-right p-3 rounded-xl hover:bg-white/5 transition font-bold">من نحن</button>
            <button @click="lang = (lang === 'ar' ? 'en' : 'ar')" class="w-full text-right p-3 rounded-xl bg-blue-600/10 text-blue-400 border border-blue-500/20 font-bold">
                <span x-text="lang === 'ar' ? 'English' : 'العربية'"></span> 🌐
            </button>
        </nav>
    </div>

    <main class="flex h-[calc(100vh-65px)] p-4 gap-4">
        
        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div class="px-6 py-3 border-b border-white/5 bg-white/5 flex justify-between items-center">
                <span class="text-[10px] font-black text-blue-500 tracking-widest uppercase">Editor</span>
                <div class="flex gap-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                </div>
            </div>
            <div class="flex-1 scroll-area">
                <textarea id="majal-editor" oninput="MajalCore.process()" placeholder="// اكتب كودك هنا..."></textarea>
            </div>
        </div>

        <div class="flex-1 glass rounded-[30px] flex flex-col overflow-hidden">
            <div class="px-6 py-3 border-b border-white/5 bg-white/5 flex justify-between items-center text-[10px] font-black text-gray-500 uppercase tracking-widest">
                <span>Canvas</span>
                <span class="text-green-500 animate-pulse">Live</span>
            </div>
            <div class="flex-1 p-4 overflow-hidden">
                <div id="live-canvas"></div>
            </div>
        </div>

    </main>

    <script>
        const MajalCore = {
            registry: new Map(),
            process: function() {
                const code = document.getElementById('majal-editor').value;
                const canvas = document.getElementById('live-canvas');
                if(!code.trim()) { canvas.innerHTML = ''; return; }
                
                this.registry.clear();
                let htmlOutput = "";
                const lines = code.split('\n');

                lines.forEach(line => {
                    const clean = line.trim();
                    if (clean.startsWith("عرف")) {
                        const parts = clean.replace("عرف", "").split("=");
                        if (parts[1]) {
                            const key = parts[0].trim();
                            const val = parts[1].trim().replace(/['"]+/g, '');
                            this.registry.set(key, val);
                        }
                    } else {
                        htmlOutput += line + "\n";
                    }
                });

                // معالجة المتغيرات بذكاء أكبر
                this.registry.forEach((v, k) => {
                    const regex = new RegExp(`{${k}}`, 'g');
                    htmlOutput = htmlOutput.replace(regex, v);
                });

                canvas.innerHTML = htmlOutput;
            }
        };
    </script>
</body>
</html>
