<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>MAJAL PRO | PRECISION ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;900&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        #majal-editor { font-family: 'monospace'; background: transparent; border: none; outline: none; resize: none; color: #93c5fd; font-size: 20px; width: 100%; height: 100%; padding: 35px; font-weight: bold; }
        #live-canvas { background: #fff; border-radius: 35px; width: 100%; height: 100%; overflow: auto; border: 4px solid #1e293b; }
    </style>
</head>
<body x-data="majalApp()" x-init="init()">

    <header class="h-[65px] flex items-center justify-between px-10 border-b border-white/5 bg-black/50 z-50">
        <h1 class="text-xl font-black italic text-blue-500">MAJAL <span class="text-white font-light text-xs">PRECISION v8.0</span></h1>
        <div id="build-timer" class="text-[10px] font-mono text-gray-500 tracking-widest uppercase">READY TO BUILD</div>
    </header>

    <main class="flex flex-col h-[calc(100vh-65px)] p-5 gap-5">
        <div class="flex-1 glass rounded-[35px] flex flex-col overflow-hidden border border-blue-500/10">
            <textarea id="majal-editor" @input="onInput($event)" placeholder="مثال: متجر سديم لبيع العطور ألوان أسود وذهبي"></textarea>
        </div>
        <div class="flex-1 glass rounded-[35px] flex flex-col overflow-hidden">
            <div id="live-canvas">
                <div class="flex items-center justify-center h-full text-gray-600 italic text-sm">أدخل أمر البناء بدقة ليتم التنفيذ...</div>
            </div>
        </div>
    </main>

    <script>
        function majalApp() {
            return {
                init() { this.generate(); },
                onInput() { this.generate(); },
                generate() {
                    const startTime = performance.now();
                    const input = document.getElementById('majal-editor').value.trim();
                    const canvas = document.getElementById('live-canvas');
                    const timerDisp = document.getElementById('build-timer');
                    
                    if (!input.includes("متجر")) return;

                    // 1. استخراج اسم المتجر بدقة
                    let storeName = "متجر جديد";
                    const nameMatch = input.match(/متجر\s+([\u0621-\u064A0-9]+(\s+[\u0621-\u064A0-9]+)?)/);
                    if (nameMatch && nameMatch[1]) {
                        storeName = nameMatch[1].replace(/لبيع|ألوان|بالون|لون/g, "").trim();
                    }

                    // 2. تحليل الألوان
                    const colorMap = {
                        'أحمر': '#ef4444', 'أزرق': '#2563eb', 'أصفر': '#eab308', 'أبيض': '#ffffff', 
                        'أسود': '#0f172a', 'ذهبي': '#d4af37', 'فضي': '#c0c0c0'
                    };
                    let primary = '#2563eb';
                    let bg = '#ffffff';
                    
                    Object.keys(colorMap).forEach(key => {
                        if (input.includes(key)) {
                            if (key === 'أبيض' || key === 'أسود') bg = colorMap[key];
                            else primary = colorMap[key];
                        }
                    });

                    // 3. تحديد نوع النشاط
                    let type = "متجر إلكتروني";
                    let emoji = "📦";
                    if (input.includes("عطور")) { type = "عطور فاخرة"; emoji = "🧴"; }
                    else if (input.includes("اشتراك")) { type = "اشتراكات رقمية"; emoji = "⚡"; }
                    else if (input.includes("كتب")) { type = "مكتبة سيادية"; emoji = "📚"; }

                    // البناء
                    canvas.innerHTML = `
                        <div style="background: ${bg}; color: ${bg === '#0f172a' ? '#fff' : '#000'}; min-height: 100%; transition: 0.3s;" dir="rtl" class="p-8">
                            <nav class="flex justify-between items-center mb-8 border-b pb-4" style="border-color: ${primary}44">
                                <h2 class="text-2xl font-black" style="color: ${primary}">${storeName}</h2>
                                <span class="text-xs opacity-50 font-bold tracking-tighter">${type}</span>
                            </nav>
                            
                            <div class="rounded-[30px] p-12 mb-8 text-center shadow-2xl" style="background: ${primary}; color: ${primary === '#ffffff' ? '#000' : '#fff'}">
                                <h1 class="text-4xl font-black mb-2 italic tracking-tighter">${storeName}</h1>
                                <p class="opacity-80 text-sm font-bold uppercase tracking-widest">أهلاً بك في وجهتك المفضلة لـ ${type}</p>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                ${[1, 2].map(i => `
                                    <div class="bg-white/5 p-6 rounded-[30px] border border-gray-100 shadow-sm" style="background: ${bg === '#0f172a' ? '#1e293b' : '#ffffff'}">
                                        <div class="h-32 rounded-2xl mb-4 flex items-center justify-center text-4xl bg-black/5">${emoji}</div>
                                        <h3 class="font-black text-lg mb-4">منتج من ${storeName}</h3>
                                        <button class="w-full py-4 rounded-2xl font-black text-white shadow-lg" style="background: ${primary}">إضافة 🛒</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                    const endTime = performance.now();
                    const duration = (endTime - startTime).toFixed(2);
                    timerDisp.innerText = `LAST BUILD: ${duration} MS | ACCURACY: HIGH`;
                }
            }
        }
    </script>
</body>
</html>
